                    </div>

                    <div className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-800/50 p-4 md:p-5 rounded-xl border border-slate-700/50 shadow-inner">
                        <div className="flex justify-between items-center mb-1 border-b border-slate-700 pb-1.5">
                            <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest">Offensive Output (Expected Strike Damage)</h4>
                            <label className="flex items-center gap-2 cursor-pointer bg-slate-900 px-2 py-1 rounded border border-slate-700 hover:border-slate-500 transition">
                                <span className="text-[10px] font-bold text-slate-300 uppercase">Enable Critical Hits (+25%)</span>
                                <input type="checkbox" checked={statsCritEnabled} onChange={(e) => setStatsCritEnabled(e.target.checked)} className="accent-amber-500 w-3.5 h-3.5" />
                            </label>
                        </div>
                        <p className="text-[10px] text-slate-500 font-semibold mb-3 leading-tight">Comparing your deck's early skirmish power to its late-game finisher ceiling.</p>
                        <div className="flex flex-col sm:flex-row gap-4 md:gap-6 items-center justify-around mb-2">
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-slate-400">{deckAnalytics.overallDeckStrike}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Overall Deck Avg</div>
                            </div>
                            <div className="hidden sm:block text-lg text-slate-700 font-black">➡</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-purple-400">{deckAnalytics.peakDeckStrike}</div>
                                <div className="text-xs text-amber-400 uppercase font-bold mt-1">Peak Finisher Avg</div>
                                <div className="text-[9px] text-slate-500 mt-0.5">Top 3 Strongest Attacks</div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Ally Averages</h4>
                        <div className="space-y-3">
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Power:</span>
                                <span className="text-sm md:text-lg font-bold text-rose-400">{deckAnalytics.avgPower}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Ranged Attack:</span>
                                <span className="text-sm md:text-lg font-bold text-purple-400">{deckAnalytics.avgRangedAttack}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Dexterity:</span>
                                <span className="text-sm md:text-lg font-bold text-emerald-400">{deckAnalytics.avgDex}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Health:</span>
                                <span className="text-sm md:text-lg font-bold text-amber-400">{deckAnalytics.avgHealth}</span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800 min-w-0">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Mana / Charge Curve</h4>
                        <div className="pt-1 min-w-0 w-full">
                            {["0-1", "2", "3", "4", "5+"].map(label => (
                                <BarChartRow key={label} label={label} value={deckAnalytics.curve[label]} max={deckAnalytics.maxCurve} color="bg-blue-500" />
                            ))}
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800 min-w-0">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Deck Composition</h4>
                        <div className="pt-1 min-w-0 w-full">
                            {["Ally", "Skill", "Equipment", "Flash", "Synergy"].map(label => (
                                <BarChartRow key={label} label={label} value={deckAnalytics.types[label]} max={deckAnalytics.maxType} color="bg-amber-500" />
                            ))}
                        </div>
                    </div>
                </div>
              </div>
            </div>
          )}

          {/* SINGLE CARD MODAL WITH IN-PLACE EDITING */}
          {modalCard && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 md:p-4 z-[70]">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-5xl p-0 max-h-[95dvh] flex flex-col sm:flex-row shadow-2xl overflow-hidden min-w-0">
                {modalCard["Image URL"] && (
                  <div className="w-full sm:w-1/2 h-[30dvh] sm:min-h-[600px] bg-black border-b sm:border-b-0 sm:border-r border-slate-800 flex items-center justify-center p-2 md:p-4 shrink-0">
                    <img src={`${formatImageUrl(modalCard["Image URL"])}?t=${Date.now()}`} className="max-w-full max-h-full object-contain drop-shadow-2xl rounded-xl" />
                  </div>
                )}
                
                <div className="flex-1 flex flex-col min-w-0 max-h-[60dvh] sm:max-h-[90dvh]">
                  <div className="px-4 py-3 md:px-6 md:py-4 border-b border-slate-800 flex justify-between items-start bg-slate-800/40 shrink-0">
                    <div className="min-w-0 pr-2">
                      <div className="flex items-center gap-2">
                          <h3 className="text-base md:text-xl font-bold text-slate-100 truncate">{modalCard["Card Name"] || modalCard["Hero Name"]}</h3>
                          <span className={`text-[8px] uppercase font-bold px-1.5 py-0.5 rounded flex items-center gap-1 shrink-0 border ${String(modalCard["Is Official"]) === "true" || modalCard.Creator === 'Gavin' ? 'bg-slate-800 text-slate-400 border-slate-600' : 'bg-purple-900/60 text-purple-300 border-purple-700/50'}`}>
                              {String(modalCard["Is Official"]) === "true" || modalCard.Creator === 'Gavin' ? '🛡️ Official' : '🧪 Community'}
                          </span>
                      </div>
                      <p className="text-xs md:text-sm text-amber-500 font-semibold mt-0.5 truncate">{modalCard._type} • {modalCard["Card Rarity"] || "Common"}</p>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      {/* Only Card Creator or Gavin can edit/delete */}
                      {currentUser && (currentUser === modalCard.Creator || currentUser === 'Gavin') && (
                        <div className="flex items-center gap-1.5">
                          <button 
                            onClick={() => setModalEditMode(!modalEditMode)} 
                            className={`px-2.5 py-1 rounded text-xs font-bold transition border ${modalEditMode ? 'bg-amber-600 text-white border-amber-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white'}`}>
                            {modalEditMode ? '✓ Done' : '✏️ Edit'}
                          </button>
                          <button 
                            onClick={() => handleDeleteCard(modalCard._id)} 
                            className="px-2 py-1 rounded bg-rose-900/50 hover:bg-rose-800 text-rose-300 text-xs font-bold transition border border-rose-800/50" 
                            title="Delete Card">
                            🗑️
                          </button>
                        </div>
                      )}
                      <button onClick={() => { setModalCard(null); setModalEditMode(false); }} className="text-slate-400 hover:text-white font-bold text-xl p-1 leading-none rounded hover:bg-slate-700 transition">✕</button>
                    </div>
                  </div>

                  <div className="p-4 md:p-6 overflow-y-auto space-y-3 text-xs md:text-sm divide-y divide-slate-800/60 flex-1 relative min-w-0">
                    {((modalEditMode && currentUser && (currentUser === modalCard.Creator || currentUser === 'Gavin'))
                      ? (FORGE_LAYOUTS[modalCard._type] || Object.keys(modalCard).filter(k => !k.startsWith('_')))
                      : Object.keys(modalCard).filter(k => !k.startsWith('_'))
                    ).filter(key => {
                      if (key.startsWith('_') || key === "Creator" || key === "Is Official" || key === "Status Notes") return false;
                      const canEditThisCard = modalEditMode && currentUser && (currentUser === modalCard.Creator || currentUser === 'Gavin');
					  const cardValue = modalCard[key];
					  if (!canEditThisCard && (cardValue === "" || cardValue === null || cardValue === undefined || key === "Image URL")) return false;

                      if (canEditThisCard) {
                        const cat = modalCard._type;
                        const at = modalCard["Attack Type"];
                        const flashSub = modalCard["Flash Subtype"];
                        const eqType = modalCard["Equipment Type"];
                        
                        if (cat === 'Token') {
                            if (key === "Token Type") return true;
                            if (modalCard["Token Type"] === "Misc") {
                                return ["Card Name", "Token Type", "Abilities", "Image URL"].includes(key);
                            }
                        }

                        if (key === "Attack Type") {
                            if (cat === 'Equipment' && (eqType === 'Armor' || eqType === 'Shield' || eqType === 'Accessory' || !eqType)) return false;
                        }

                        if (["Attack", "Ranged Attack", "Power", "Power Modifier"].includes(key)) {
                            if (cat === 'Equipment' && (eqType === 'Armor' || eqType === 'Shield' || eqType === 'Accessory' || !eqType)) return false;
                            if (!at || at === "") return false;
                            if (at === "Melee" && key === "Ranged Attack") return false;
                            if (at === "Ranged" && (key === "Attack" || key === "Power" || key === "Power Modifier")) return false;
                        }
                        
                        if (key === "Power" && modalCard["Attack"] === "None") return false;
                        if (key === "Power Modifier" && modalCard["Attack"] !== "None") return false;
                        
                        if (key === "Charge Requirement") {
                            if (cat === 'Equipment') {
                                if (eqType === 'Armor' || eqType === 'Accessory' || !eqType) return false;
                                if (eqType === 'Shield') return true;
                                if ((eqType === 'One-Handed Weapon' || eqType === 'Two-Handed Weapon') && (!at || at === "")) return false;
                            } else {
                                if (!at || at === "") return false;
                            }
                        }

                        if (cat === 'Flash') {
                            if (flashSub === 'Item' && (key === 'Mana Cost' || key === 'Faction')) return false;
                            if (flashSub === 'Event' && key === 'Gold Cost') return false;
                        }

                        if (cat === 'Equipment') {
                            if (eqType === 'Armor' && key === 'Defense Die Roll Modifier') return false;
                            if (eqType === 'Shield' && key === 'Defense Modifier') return false;
                            if ((eqType === 'One-Handed Weapon' || eqType === 'Two-Handed Weapon' || eqType === 'Accessory' || !eqType) && (key === 'Defense Modifier' || key === 'Defense Die Roll Modifier')) return false;
                        }
                      }

                      return true;
                    }).map(key => {
                      const val = modalCard[key];
                      const spec = FIELD_TYPES[key] || { type: 'text' };
                      const v = val === undefined || val === null ? "" : val;
                      const cat = modalCard._type;

                      const updateVal = (newVal) => {
                        handleInlineChange(modalCard._id, key, newVal);
                        setModalCard(prev => ({ ...prev, [key]: newVal }));
                      };

                      return (
                        <div key={key} className="pt-2.5 flex flex-col sm:flex-row sm:justify-between sm:gap-6 gap-1 min-w-0">
                          <span className="text-slate-500 font-medium shrink-0 uppercase tracking-wider text-[10px] sm:text-xs sm:mt-1">{key}</span>
                          
                          {(modalEditMode && currentUser && (currentUser === modalCard.Creator || currentUser === 'Gavin')) ? (
                            <div className="flex-1 sm:max-w-md w-full min-w-0">
                              {key === 'Class' && cat === 'Hero' ? (
                                <select 
                                  value={v} 
                                  onChange={e => updateVal(e.target.value)} 
                                  className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2.5 py-1.5 text-xs text-slate-200">
                                  {["", "Assassin", "Berserker", "Mage", "Paladin", "Ranger", "Warrior"].map(o => (
                                    <option key={o} value={o}>{o === "" ? "-- Select --" : o}</option>
                                  ))}
                                </select>
                              ) : (key === 'Class' && (cat === 'Ally' || cat === 'Token')) || (key === 'Equipment Subtype' && cat === 'Equipment') ? (
                                <>
                                  <input 
                                    list={`modal-${key.replace(/\s+/g, '-').toLowerCase()}-list`} 
                                    type="text" 
                                    value={v} 
                                    onChange={e => updateVal(e.target.value)} 
                                    className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2.5 py-1.5 text-xs text-slate-200" 
                                    placeholder={`Select or type ${key.toLowerCase()}...`} 
                                  />
                                  <datalist id={`modal-${key.replace(/\s+/g, '-').toLowerCase()}-list`}>
                                    {FIELD_TYPES[key].options.map(o => <option key={o} value={o} />)}
                                  </datalist>
                                </>
                              ) : spec.type === 'textarea' ? (
                                <div className="flex flex-col gap-1.5 w-full min-w-0">
                                  {key === 'Abilities' && (
                                    <div className="flex gap-2 w-full">
                                      <button type="button" onClick={() => { setAbilityBuilderTarget('modal'); setShowAbilityBuilder(true); }} className="text-xs bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-orange-400 text-slate-950 font-black px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-md border border-amber-300"><span>✨</span><span>Guided Ability Builder</span></button><button type="button" onClick={() => updateVal((v || '') + '[Mana:2] ')} className="text-[10px] bg-purple-900/60 border border-purple-700/60 text-purple-200 px-2 py-0.5 rounded hover:bg-purple-800/80 transition flex items-center gap-1">
                                        <span className="w-3 h-3 rounded-full bg-purple-600 inline-flex items-center justify-center text-[8px] font-bold text-white">M</span> + Mana
                                      </button>
                                      <button type="button" onClick={() => updateVal((v || '') + '[Gold:2]')} className="text-[10px] bg-amber-900/60 border border-amber-700/60 text-amber-200 px-2 py-0.5 rounded hover:bg-amber-800/80 transition flex items-center gap-1">
                                        <span className="w-3 h-3 rounded-full bg-amber-500 inline-flex items-center justify-center text-[8px] font-bold text-slate-950">G</span> + Gold
                                      </button>
                                    </div>
                                  )}
                                  <textarea 
                                    value={v} 
                                    onChange={e => updateVal(e.target.value)} 
                                    className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2.5 py-1.5 text-xs text-slate-200 min-h-[60px]" 
                                  />
                                </div>
                              ) : spec.type === 'select' ? (
                                <select 
                                  value={v} 
                                  onChange={e => updateVal(e.target.value)} 
                                  className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200">
                                  {spec.options.map(o => <option key={o} value={o}>{o === "" ? "-- Select --" : o}</option>)}
                                </select>
                              ) : spec.type === 'multiselect' ? (
                                (() => {
                                  let currentOptions = spec.options;
                                  if (cat === 'Hero' && key === 'Faction') {
                                    currentOptions = currentOptions.filter(o => o.toLowerCase() !== 'factionless');
                                  }
                                  const selectedArr = parseCommaList(v).map(s => currentOptions.find(o => o.toLowerCase() === s) || s);
                                  return (
                                    <select 
                                      multiple 
                                      size={4} 
                                      value={selectedArr} 
                                      onChange={e => { 
                                        const s = Array.from(e.target.selectedOptions, opt => opt.value); 
                                        if (key === 'Faction') {
                                          const max = cat === 'Hero' ? 1 : 2;
                                          if (s.length > max) return triggerToast(`Max ${max} faction(s) allowed for ${cat}.`, true);
                                        }
                                        if (key === 'Compatible Classes' && cat === 'Skill') {
                                          if (s.length > 3) return triggerToast(`Max 3 compatible classes allowed.`, true);
                                        }
                                        updateVal(s.join(", ")); 
                                      }} 
                                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 h-[75px]">
                                      {currentOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                    </select>
                                  );
                                })()
                              ) : spec.type === 'number' ? (
                                <input 
                                  type="number" 
                                  step="any" 
                                  value={v} 
                                  onChange={e => updateVal(e.target.value)} 
                                  className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2.5 py-1 text-xs text-slate-200" 
                                />
                              ) : (
                                <input 
                                  type="text" 
                                  value={v} 
                                  onChange={e => updateVal(e.target.value)} 
                                  className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2.5 py-1 text-xs text-slate-200" 
                                />
                              )}
                            </div>
                          ) : (
                            <span className="text-left sm:text-right text-slate-200 break-words flex-1 leading-relaxed min-w-0">
                                {key === 'Abilities' && val ? (
                                    <div className="space-y-1.5 text-left">
                                        <div className="text-[9px] uppercase tracking-wider font-bold text-amber-400/80 flex items-center justify-between">
                                            <span>Abilities</span>
                                            <span className="text-[8px] text-slate-400 font-normal">Click a clause to load in builder</span>
                                        </div>
                                        {String(val).split(/\n\s*\n/).map((clause, cIdx) => (
                                            <div 
                                                key={cIdx}
                                                onClick={() => {
                                                    setAbilityBuilderTarget('modal');
                                                    setInitialBuilderClause(clause.trim());
                                                    setShowAbilityBuilder(true);
                                                }}
                                                className="p-1.5 rounded bg-slate-900/60 hover:bg-amber-950/40 border border-slate-800 hover:border-amber-500/50 cursor-pointer transition group"
                                                title="Click to load into Guided Ability Builder"
                                            >
                                                <div className="flex items-start justify-between gap-1.5">
                                                    <div className="flex-1">{renderAbilityText(clause)}</div>
                                                    <span className="text-[9px] text-amber-400 opacity-0 group-hover:opacity-100 transition whitespace-nowrap bg-amber-950 px-1.5 py-0.5 rounded border border-amber-600/50">
                                                        ⚡ Load in Builder
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    String(val)
                                )}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* GUIDED ABILITY BUILDER MODAL */}
          <AbilityBuilderModal
            isOpen={showAbilityBuilder}
            onClose={() => { setShowAbilityBuilder(false); setInitialBuilderClause(''); }}
            cardName={abilityBuilderTarget === 'forge' ? (forgeData['Card Name'] || '') : (modalCard ? (modalCard['Card Name'] || modalCard['Hero Name'] || '') : '')}
            cardType={abilityBuilderTarget === 'forge' ? forgeCategory : (modalCard ? modalCard._type : 'Ally')}
            initialAbilities={abilityBuilderTarget === 'forge' ? (forgeData['Abilities'] || '') : (modalCard ? (modalCard['Abilities'] || '') : '')}
            initialClause={initialBuilderClause}
            onApply={(newAbilities) => {
              if (abilityBuilderTarget === 'forge') {
                handleForgeChange('Abilities', newAbilities);
                triggerToast("Card ability updated!", false);
              } else if (modalCard) {
                handleInlineChange(modalCard._id, 'Abilities', newAbilities);
                setModalCard(prev => ({ ...prev, Abilities: newAbilities }));
                triggerToast("Card ability updated!", false);
              }
            }}
          />

          {/* USER AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[90]">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl min-w-0">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">👤 Profile Login / Register</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <p className="text-xs text-slate-400 mb-3 leading-relaxed">
                  Enter your username and a private PIN. If this is your first time using this name, your PIN will be saved to secure your account.
                </p>
                {authError && (
                    <div className="mb-3 p-2 rounded bg-rose-950/80 border border-rose-800 text-rose-300 text-xs font-semibold break-words">
                        {authError}
                    </div>
                )}
                <form onSubmit={handleAuthSubmit} className="space-y-3 w-full">
                  <div>
                    <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Username</label>
                    <input type="text" value={authUsername} onChange={e => setAuthUsername(e.target.value)} placeholder="e.g. Gavin" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Secret PIN / Passcode</label>
                    <input type="password" value={authPin} onChange={e => setAuthPin(e.target.value)} placeholder="e.g. 1234" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-md">
                    Sign In / Register
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
