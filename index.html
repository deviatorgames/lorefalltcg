                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 2. Deck List Sidebar */}
                <div className={`w-full max-w-full md:w-80 bg-slate-900 md:border-l border-slate-800 flex-col shrink-0 min-h-0 absolute md:relative inset-0 md:inset-auto z-10 ${mobileDeckView ? 'flex' : 'hidden md:flex'}`}>
                  <div className="p-3 md:p-4 border-b border-slate-800 bg-slate-800/40 shrink-0 shadow-sm w-full">
                    <div className="flex justify-between items-center mb-2">
                      <h2 className="text-sm font-bold uppercase tracking-wider text-slate-300">Main Deck</h2>
                      <span className={`text-xs px-2 py-0.5 rounded font-bold ${deckCount === MAX_DECK ? 'bg-emerald-950 border border-emerald-800 text-emerald-400' : 'bg-amber-950 border border-amber-800 text-amber-400'}`}>{deckCount} / {MAX_DECK}</span>
                    </div>
                    <div className="w-full bg-slate-700/50 h-2 rounded-full overflow-hidden">
                      <div className={`h-full transition-all duration-300 ${deckCount === MAX_DECK ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${Math.min((deckCount / MAX_DECK) * 100, 100)}%` }} />
                    </div>
                    {deckCount === MAX_DECK && (
                        <button onClick={handleSaveDeck} className={`w-full mt-2.5 py-2 text-white text-xs font-bold uppercase tracking-wider rounded transition shadow-[0_0_10px_rgba(5,150,105,0.3)] ${currentUser ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-slate-700 hover:bg-slate-600'}`}>
                            {currentUser ? 'Save Deck' : 'Login to Save Deck'}
                        </button>
                    )}
                    {deckCount > 0 && (
                        <button onClick={() => {
                            setStatsTargetDeck(null);
                            setShowStatsModal(true);
                        }} className="w-full mt-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold uppercase tracking-wider rounded transition border border-slate-700">📊 View Deck Stats</button>
                    )}
                  </div>
                  <div className="flex-1 overflow-y-auto p-3 md:p-4 pb-24 md:pb-4 space-y-2 min-h-0 w-full">
                    {Object.values(deck).map(({ card, count }) => (
                      <div key={card._id} className="flex justify-between items-center bg-slate-800/50 border border-slate-700/50 rounded-lg px-3 py-2 text-sm hover:bg-slate-800/80 transition min-w-0">
                        <div className="truncate mr-2 flex-1 cursor-pointer min-w-0" onClick={() => setModalCard(card)}>
                          <span className="font-bold text-amber-400 mr-2">{count}×</span>
                          <span className="text-slate-200">{card["Card Name"] || card["Hero Name"]}</span>
                        </div>
                        <button onClick={() => handleRemoveCard(card._id)} className="w-6 h-6 rounded bg-rose-900/40 text-rose-300 flex items-center justify-center text-xs font-bold shrink-0 transition hover:bg-rose-700 hover:text-white">✕</button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 3. Floating Mobile Action Toggle */}
                <div className="md:hidden absolute bottom-3 left-3 right-3 z-30">
                    <button onClick={() => setMobileDeckView(!mobileDeckView)} className="w-full py-3 bg-gradient-to-r from-amber-600 to-amber-500 active:scale-98 rounded-xl font-bold text-white shadow-xl border border-amber-400 uppercase tracking-widest text-xs transition">
                        {mobileDeckView ? '🔍 Back to Card Search' : `📋 View Active Deck (${deckCount}/40)`}
                    </button>
                </div>

              </div>
            ) : view === 'saved-decks' ? (
              
              /* VIEW: SAVED DECKS */
              <div className="flex flex-col md:flex-row flex-1 min-h-0 bg-slate-950 w-full max-w-full">
                 <div className="w-full max-w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-800 p-4 md:p-6 overflow-y-auto bg-slate-900/50 flex flex-col h-[35vh] md:h-auto shrink-0 min-w-0">
                   <div className="flex justify-between items-center mb-3">
                       <h2 className="text-lg font-bold text-slate-200 uppercase tracking-wider text-xs">Saved Decks</h2>
                   </div>
                   
                   <div className="flex bg-slate-800/80 rounded-lg p-1 border border-slate-700 mb-3 shrink-0">
                       <button onClick={() => setSavedDeckTab('All')} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition ${savedDeckTab === 'All' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-200'}`}>All Decks</button>
                       <button onClick={() => {
                           if (!currentUser) return triggerToast("Please login to view your decks.", true);
                           setSavedDeckTab('Mine');
                       }} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition ${savedDeckTab === 'Mine' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>My Decks</button>
                   </div>
                   
                   {Object.keys(savedDecks).length === 0 && <p className="text-slate-500 text-xs">No decks saved yet.</p>}
                   <div className="space-y-2.5 flex-1 overflow-y-auto pr-1 min-w-0 w-full">
                     {Object.entries(savedDecks)
                        .filter(([_, data]) => savedDeckTab === 'All' || data.creator === currentUser)
                        .map(([name, deckData]) => {
                        const hero = cards.find(c => c._id === deckData.heroId);
                        const isSelected = selectedSavedDeck === name;
                        const sDeckTotal = Object.values(deckData.cards).reduce((sum, item) => sum + item.count, 0);
                        return (
                          <div key={name} className={`p-3 rounded-xl border cursor-pointer transition min-w-0 ${isSelected ? 'bg-amber-900/20 border-amber-600' : 'bg-slate-800/80 border-slate-700 hover:border-amber-500/50'}`} onClick={() => setSelectedSavedDeck(name)}>
                            <div className="flex justify-between items-start min-w-0 gap-2">
                                <h3 className="font-bold text-amber-500 text-base leading-tight truncate min-w-0">{name}</h3>
                                <span className="text-[10px] bg-slate-900 border border-slate-700 px-1.5 py-0.5 rounded text-slate-400 shrink-0">{sDeckTotal} Cards</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-1 truncate">Hero: {hero ? (hero["Card Name"] || hero["Hero Name"]) : "Unknown"} <br/><span className="text-amber-500/70">By: {deckData.creator || 'Anonymous'}</span></p>
                          </div>
                        )
                     })}
                   </div>
                 </div>
                 
                 <div className="flex-1 p-4 md:p-6 overflow-y-auto min-w-0 w-full">
                   {selectedSavedDeck && savedDecks[selectedSavedDeck] ? (() => {
                      const sDeck = savedDecks[selectedSavedDeck];
                      const hero = cards.find(c => c._id === sDeck.heroId);
                      const sDeckTotal = Object.values(sDeck.cards).reduce((sum, item) => sum + item.count, 0);
                      return (
                        <div className="min-w-0">
                          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-5 min-w-0">
                            <div className="min-w-0">
                                <h2 className="text-xl md:text-2xl font-bold text-slate-100 truncate">{selectedSavedDeck}</h2>
                                <p className="text-xs md:text-sm text-slate-400 mt-0.5">Total Main Deck: <strong className="text-amber-500">{sDeckTotal} / 40 Cards</strong></p>
                            </div>
                            <div className="flex gap-2 shrink-0">
								<button onClick={() => {
									setStatsTargetDeck(sDeck);
									setShowStatsModal(true);
								}} className="flex-1 sm:flex-none px-3.5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded font-bold text-xs md:text-sm shadow transition border border-slate-600">📊 Stats</button>
								<button onClick={() => {
									setSelectedHeroId(sDeck.heroId);
									setDeck(JSON.parse(JSON.stringify(sDeck.cards)));
									setView('deck-builder');
									triggerToast("Deck loaded into Builder!", false);
								}} className="flex-1 sm:flex-none px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-xs md:text-sm shadow transition">Load into Builder</button>
								{(!sDeck.creator || sDeck.creator === currentUser) && (
									<button onClick={async () => {
										if (confirm(`Are you sure you want to delete "${selectedSavedDeck}"?`)) {
											const newDecks = { ...savedDecks };
											delete newDecks[selectedSavedDeck];
											setSavedDecks(newDecks);
											setSelectedSavedDeck(null);
											if (supabase) {
												await supabase.from('saved_decks').delete().eq('name', selectedSavedDeck);
											}
										}
									}} className="px-3.5 py-2 bg-rose-900/80 hover:bg-rose-800 text-rose-200 rounded font-bold text-xs md:text-sm transition">Delete</button>
								)}
							</div>
                          </div>
                          
                          {hero && (
                            <div className="mb-4 p-3 bg-slate-800/80 rounded-xl border border-slate-700 flex gap-3 items-center min-w-0">
                              <div className="w-12 h-12 rounded bg-slate-900 border border-slate-700 flex items-center justify-center text-2xl shrink-0 cursor-pointer" onClick={() => setModalCard(hero)}>👑</div>
                              <div className="min-w-0">
                                <h3 className="font-bold text-base text-slate-200 cursor-pointer hover:text-amber-400 transition truncate" onClick={() => setModalCard(hero)}>{hero["Card Name"] || hero["Hero Name"]}</h3>
                                <p className="text-xs text-amber-500 truncate">{hero.Faction} • {hero.Class}</p>
                              </div>
                            </div>
                          )}

                          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2.5 w-full">
                            {Object.values(sDeck.cards).map(({card, count}) => (
                               <div key={card._id} className="bg-slate-800/50 p-2.5 rounded-lg border border-slate-700/50 flex justify-between items-center cursor-pointer hover:border-slate-500 transition min-w-0" onClick={() => setModalCard(card)}>
                                 <div className="truncate mr-2 min-w-0 flex-1">
                                    <span className="font-bold text-amber-400 mr-2">{count}×</span>
                                    <span className="text-xs md:text-sm text-slate-200 truncate">{card["Card Name"] || card["Hero Name"]}</span>
                                 </div>
                                 <span className="text-[10px] uppercase font-bold bg-slate-900 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700 shrink-0">{card["Card Rarity"] || "Common"}</span>
                               </div>
                            ))}
                          </div>
                        </div>
                      );
                   })() : (
                      <div className="flex h-full items-center justify-center text-slate-500 text-center p-4 text-xs">Select a deck from the list to view its contents.</div>
                   )}
                 </div>
              </div>
            ) : view === 'card-forge' ? (

              /* VIEW: CARD FORGE */
              <div className="flex flex-col md:flex-row flex-1 min-h-0 bg-slate-950 overflow-hidden w-full max-w-full">
                
                {/* Forge Form */}
                <div className="w-full max-w-full md:w-1/2 border-t md:border-t-0 md:border-r border-slate-800 flex flex-col bg-slate-900/40 order-2 md:order-1 flex-1 md:flex-none md:h-auto min-h-0 min-w-0">
                  <div className="p-3 md:p-6 border-b border-slate-800 bg-slate-800/60 shrink-0 w-full">
                    <h2 className="text-base md:text-xl font-bold text-slate-100 flex items-center gap-2 mb-2 md:mb-4">⚒️ Card Forge</h2>
                    <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-hide w-full max-w-full">
                        {Object.keys(FORGE_LAYOUTS).map(cat => (
                            <button key={cat} onClick={() => { setForgeCategory(cat); setForgeData({}); }} className={`shrink-0 px-3 py-1 md:px-4 md:py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition ${forgeCategory === cat ? 'bg-amber-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 hover:bg-slate-700'}`}>{cat}</button>
                        ))}
                    </div>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto p-3 md:p-6 w-full min-w-0">
                    <form id="forgeForm" onSubmit={handleForgeSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 w-full">
                        {FORGE_LAYOUTS[forgeCategory].filter(key => {
                            const at = forgeData["Attack Type"];
                            const flashSub = forgeData["Flash Subtype"];
                            const eqType = forgeData["Equipment Type"];
                            
                            if (key === "Attack Type") {
                                if (forgeCategory === 'Equipment' && (eqType === 'Armor' || eqType === 'Shield' || eqType === 'Accessory' || !eqType)) return false;
                            }

                            if (["Attack", "Ranged Attack", "Power", "Power Modifier"].includes(key)) {
                                if (forgeCategory === 'Equipment' && (eqType === 'Armor' || eqType === 'Shield' || eqType === 'Accessory' || !eqType)) return false;
                                if (!at || at === "") return false;
                                if (at === "Melee" && key === "Ranged Attack") return false;
                                if (at === "Ranged" && (key === "Attack" || key === "Power" || key === "Power Modifier")) return false;
                            }
                            
                            if (key === "Power" && forgeData["Attack"] === "None") return false;
                            if (key === "Power Modifier" && forgeData["Attack"] !== "None") return false;
                            
                            if (key === "Charge Requirement") {
                                if (forgeCategory === 'Equipment') {
                                    if (eqType === 'Armor' || eqType === 'Accessory' || !eqType) return false;
                                    if (eqType === 'Shield') return true;
                                    if ((eqType === 'One-Handed Weapon' || eqType === 'Two-Handed Weapon') && (!at || at === "")) return false;
                                } else {
                                    if (!at || at === "") return false;
                                }
                            }

                            if (forgeCategory === 'Flash') {
                                if (flashSub === 'Item' && (key === 'Mana Cost' || key === 'Faction')) return false;
                                if (flashSub === 'Event' && key === 'Gold Cost') return false;
                            }

                            if (forgeCategory === 'Equipment') {
                                if (eqType === 'Armor' && key === 'Defense Die Roll Modifier') return false;
                                if (eqType === 'Shield' && key === 'Defense Modifier') return false;
                                if ((eqType === 'One-Handed Weapon' || eqType === 'Two-Handed Weapon' || eqType === 'Accessory' || !eqType) && (key === 'Defense Modifier' || key === 'Defense Die Roll Modifier')) return false;
                            }

                            return true;
                        }).map(key => {
                            const spec = FIELD_TYPES[key] || { type: 'text' };
                            const val = forgeData[key] === undefined ? "" : forgeData[key];
                            
                            let inputElement;
                            if (key === 'Class' && forgeCategory === 'Hero') {
                                const heroClasses = ["", "Assassin", "Berserker", "Mage", "Paladin", "Ranger", "Warrior"];
                                inputElement = (
                                    <select value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-w-0">
                                        {heroClasses.map(o => <option key={o} value={o}>{o === "" ? "-- Select --" : o}</option>)}
                                    </select>
                                );
                            } else if ((key === 'Class' && forgeCategory === 'Ally') || (key === 'Equipment Subtype' && forgeCategory === 'Equipment')) {
                                const listId = `forge-${key.replace(/\s+/g, '-').toLowerCase()}-list`;
                                inputElement = (
                                    <>
                                        <input list={listId} type="text" value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-w-0" placeholder={`Select or type ${key.toLowerCase()}...`} />
                                        <datalist id={listId}>
                                            {FIELD_TYPES[key].options.map(o => <option key={o} value={o} />)}
                                        </datalist>
                                    </>
                                );
                            } else if (spec.type === 'textarea') {
                                inputElement = (
                                    <div className="flex flex-col gap-1.5 w-full min-w-0">
                                        {key === 'Abilities' && (
                                            <div className="flex gap-2 w-full">
                                                <button type="button" onClick={() => handleForgeChange('Abilities', (forgeData['Abilities'] || '') + '[Mana:2]')} className="text-[10px] bg-purple-900/60 border border-purple-700/60 text-purple-200 px-2 py-0.5 rounded hover:bg-purple-800/80 transition flex items-center gap-1">
                                                    <span className="w-3 h-3 rounded-full bg-purple-600 inline-flex items-center justify-center text-[8px] font-bold text-white">M</span> + Mana
                                                </button>
                                                <button type="button" onClick={() => handleForgeChange('Abilities', (forgeData['Abilities'] || '') + '[Gold:2]')} className="text-[10px] bg-amber-900/60 border border-amber-700/60 text-amber-200 px-2 py-0.5 rounded hover:bg-amber-800/80 transition flex items-center gap-1">
                                                    <span className="w-3 h-3 rounded-full bg-amber-500 inline-flex items-center justify-center text-[8px] font-bold text-slate-950">G</span> + Gold
                                                </button>
                                            </div>
                                        )}
                                        <textarea value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-h-[70px] min-w-0" placeholder={`Enter ${key}...`} />
                                    </div>
                                );
                            } else if (spec.type === 'select') {
                                inputElement = (
                                    <select value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-w-0">
                                        {spec.options.map(o => <option key={o} value={o}>{o === "" ? "-- Select --" : o}</option>)}
                                    </select>
                                );
                            } else if (spec.type === 'multiselect') {
                                let currentOptions = spec.options;
                                if (forgeCategory === 'Hero' && key === 'Faction') {
                                    currentOptions = currentOptions.filter(o => o.toLowerCase() !== 'factionless');
                                }
                                const selectedArr = parseCommaList(val).map(s => currentOptions.find(o => o.toLowerCase() === s) || s);
                                inputElement = (
                                    <select multiple size={4} value={selectedArr} onChange={e => { 
                                        const s = Array.from(e.target.selectedOptions, opt => opt.value); 
                                        if (key === 'Faction') {
                                            const max = forgeCategory === 'Hero' ? 1 : 2;
                                            if (s.length > max) return triggerToast(`Max ${max} faction(s) allowed for ${forgeCategory}.`, true);
                                        }
                                        if (key === 'Compatible Classes' && forgeCategory === 'Skill') {
                                            if (s.length > 3) return triggerToast(`Max 3 compatible classes allowed.`, true);
                                        }
                                        handleForgeChange(key, s.join(", ")); 
                                    }} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 h-[90px] min-w-0">
                                        {currentOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                    </select>
                                );
                            } else if (spec.type === 'number') {
                                inputElement = <input type="number" step="any" value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-w-0" placeholder="0" />;
                            } else {
                                inputElement = <input type="text" value={val} onChange={e => handleForgeChange(key, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 min-w-0" placeholder={`Enter ${key}...`} />;
                            }

                            return (
                                <div key={key} className={`flex flex-col gap-1.5 min-w-0 w-full ${spec.type === 'textarea' || key.includes('Name') ? 'md:col-span-2' : ''}`}>
                                    <label className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">{key}</label>
                                    {inputElement}
                                </div>
                            );
                        })}
                    </form>
                  </div>
                  <div className="p-3 md:p-6 border-t border-slate-800 bg-slate-800/40 shrink-0 w-full">
                      {currentUser ? (
                          <button type="submit" form="forgeForm" className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white font-bold uppercase tracking-widest text-xs md:text-sm shadow-md transition">Forge Card to Database</button>
                      ) : (
                          <button type="button" onClick={() => { setAuthError(''); setShowAuthModal(true); }} className="w-full py-3 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-amber-400 font-bold uppercase tracking-widest text-xs transition">
                              🔒 Login Required to Forge
                          </button>
                      )}
                  </div>
                </div>
                
                {/* Live Preview */}
                <div className="w-full max-w-full md:w-1/2 p-3 md:p-10 flex items-center justify-center bg-slate-950 relative overflow-y-auto order-1 md:order-2 max-h-[35vh] md:max-h-none shrink-0 border-b md:border-b-0 border-slate-800 min-w-0">
                    <div className="w-full max-w-xs md:max-w-sm relative z-10 bg-slate-800 border border-slate-600 rounded-2xl shadow-xl flex flex-col overflow-hidden min-w-0">
                        {forgeData["Image URL"] ? (
                            <div className="w-full h-32 md:h-64 bg-black flex items-center justify-center border-b border-slate-700 p-2">
                                <img src={`${formatImageUrl(forgeData["Image URL"])}?t=${Date.now()}`} className="max-w-full max-h-full object-contain drop-shadow-md rounded" />
                            </div>
                        ) : (
                            <div className="w-full h-20 md:h-44 bg-slate-900 flex items-center justify-center border-b border-slate-700 text-slate-600 font-bold text-xs uppercase tracking-widest">
                                No Artwork
                            </div>
                        )}
                        <div className="p-3 md:p-5 min-w-0 break-words">
                            <div className="flex justify-between items-start mb-1.5 min-w-0 gap-2">
                                <h3 className="text-base md:text-2xl font-bold text-slate-100 leading-tight min-w-0 break-words">{forgeData["Card Name"] || "Unnamed Card"}</h3>
                                <div className="flex flex-col items-end gap-1 shrink-0">
                                    {(forgeData["Card Rarity"] || forgeCategory === 'Hero') && <span className="text-[10px] bg-slate-950 border border-slate-700 px-2 py-0.5 rounded text-slate-300 font-bold uppercase tracking-wider">{forgeCategory === 'Hero' ? 'Hero' : forgeData["Card Rarity"]}</span>}
                                    <span className={`text-[8px] uppercase font-bold px-1.5 py-0.5 rounded flex items-center gap-1 ${currentUser === 'Gavin' ? 'bg-slate-800 text-slate-400 border border-slate-600' : 'bg-purple-900/60 text-purple-300 border border-purple-700/50'}`}>
                                        {currentUser === 'Gavin' ? '🛡️ Official' : '🧪 Community'}
                                    </span>
                                </div>
                            </div>
                            <div className="text-xs md:text-sm font-semibold text-amber-500 mb-3 truncate">{forgeCategory} {forgeData["Mana Cost"] !== undefined && forgeData["Mana Cost"] !== "" ? `• ${forgeData["Mana Cost"]} Mana` : ''}{forgeData["Gold Cost"] !== undefined && forgeData["Gold Cost"] !== "" ? `• ${forgeData["Gold Cost"]} Gold` : ''}</div>
                            
                            <div className="space-y-1 text-xs text-slate-300 min-w-0">
                                {forgeData.Faction && <div className="truncate"><span className="text-slate-500">Faction:</span> {forgeData.Faction}</div>}
                                {forgeData.Class && <div className="truncate"><span className="text-slate-500">Class:</span> {forgeData.Class}</div>}
                                {forgeData["Compatible Classes"] && <div className="truncate"><span className="text-slate-500">Compatible:</span> {forgeData["Compatible Classes"]}</div>}
                                
                                <div className="flex flex-wrap gap-2 md:gap-4 pt-1.5 min-w-0">
                                    {forgeData.Attack && <div className="truncate"><span className="text-slate-500">ATK:</span> {forgeData.Attack} {forgeData["Attack Type"] ? `(${forgeData["Attack Type"]})` : ''}</div>}
                                    {forgeData.Power !== undefined && forgeData.Power !== "" && forgeData.Attack !== "None" && <div className="truncate"><span className="text-slate-500">PWR:</span> {forgeData.Power}</div>}
                                    {forgeData["Power Modifier"] !== undefined && forgeData["Power Modifier"] !== "" && forgeData.Attack === "None" && <div className="truncate"><span className="text-slate-500">PWR MOD:</span> {forgeData["Power Modifier"] > 0 ? '+' : ''}{forgeData["Power Modifier"]}</div>}
                                    {forgeData.Health !== undefined && forgeData.Health !== "" && <div className="truncate"><span className="text-slate-500">HP:</span> {forgeData.Health}</div>}
                                    {forgeData.Dexterity !== undefined && forgeData.Dexterity !== "" && <div className="truncate"><span className="text-slate-500">DEX:</span> {forgeData.Dexterity}</div>}
                                </div>
                            </div>
                            
                            {forgeData.Abilities && (
                                <div className="mt-2.5 pt-2.5 border-t border-slate-700 text-xs text-slate-200 whitespace-pre-wrap leading-relaxed min-w-0 break-words">
                                    {renderAbilityText(forgeData.Abilities)}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
              </div>
            ) : (

              /* VIEW: DATABASE */
              <div className="flex-1 flex flex-col min-h-0 overflow-hidden bg-slate-950 relative w-full max-w-full">
                <div className="h-10 md:h-12 border-b border-slate-800 px-3 md:px-6 flex items-center gap-2 bg-slate-900 shrink-0 overflow-x-auto scrollbar-hide max-w-full w-full">
                  {['All', 'Hero', 'Ally', 'Skill', 'Flash', 'Equipment', 'Synergy'].map(tab => (
                    <button key={tab} onClick={() => setActiveTab(tab)} className={`shrink-0 px-3 py-1 md:px-4 md:py-1.5 rounded-md text-xs font-semibold transition ${activeTab === tab ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800'}`}>{tab}</button>
                  ))}
                </div>
                <div className="flex-1 overflow-auto bg-slate-900/30 w-full relative min-w-0 block">
                  <table className="min-w-full text-left text-xs text-slate-300 border-collapse">
                    <thead className="bg-slate-800/95 text-slate-400 uppercase text-[10px] tracking-wider sticky top-0 z-20 shadow-sm border-b border-slate-700">
                      <tr>
                        {editMode && <th className="px-2 py-3 border-b border-slate-700 w-8"></th>}
                        {currentTabColumns.map(col => {
                           const isMulti = FIELD_TYPES[col]?.type === 'multiselect';
                           return (
                             <th key={col} className="px-3 py-3 whitespace-nowrap font-semibold border-b border-slate-700 cursor-pointer hover:text-white transition group select-none" onClick={() => handleSort(col)}>
                               <div className="flex items-center gap-1">
                                   {col}
                                   <span className={`text-[10px] ${sortConfig.key === col ? 'text-amber-500' : 'text-slate-600 group-hover:text-slate-400'}`}>
                                       {sortConfig.key === col ? (sortConfig.direction === 'ascending' ? '▲' : '▼') : '↕'}
                                   </span>
                               </div>
                               {editMode && isMulti && <div className="text-[8px] text-amber-500/80 normal-case mt-0.5 tracking-normal font-normal">(Ctrl+Click)</div>}
                             </th>
                           );
                        })}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50 bg-slate-900">
                      {sortedTabCards.map(c => (
                        <tr key={c._id} className="hover:bg-slate-800/40 transition-colors">
                          {editMode && <td className="px-2 py-2 border-r border-slate-800/30 text-center"><button onClick={() => handleDeleteCard(c._id)} className="text-rose-500/50 hover:text-rose-400 font-bold p-1 rounded hover:bg-rose-950 transition" title="Delete Card">✕</button></td>}
                          {currentTabColumns.map(col => (
                            <td key={col} className={`px-2 py-2 text-slate-300 border-r border-slate-800/30 last:border-0 align-top ${editMode ? 'min-w-[140px]' : 'whitespace-nowrap max-w-[200px] truncate'}`}>
                              {editMode ? (
                                (() => {
                                  const spec = FIELD_TYPES[col] || { type: 'text' };
                                  const v = c[col] === undefined || c[col] === null ? "" : c[col];

                                  if (col === 'Class' && c._type === 'Hero') {
                                      const heroClasses = ["", "Assassin", "Berserker", "Mage", "Paladin", "Ranger", "Warrior"];
                                      return <select value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 transition-colors">{heroClasses.map(o => <option key={o} value={o}>{o === "" ? "None" : o}</option>)}</select>;
                                  }
                                  if ((col === 'Class' && c._type === 'Ally') || (col === 'Equipment Subtype' && c._type === 'Equipment')) {
                                      const listId = `grid-${col.replace(/\s+/g, '-').toLowerCase()}-${c._id}`;
                                      return (
                                        <>
                                            <input list={listId} type="text" value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 transition-colors" />
                                            <datalist id={listId}>
                                                {FIELD_TYPES[col].options.map(o => <option key={o} value={o} />)}
                                            </datalist>
                                        </>
                                      );
                                  }

                                  if (spec.type === 'textarea') return <textarea value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 min-h-[50px] transition-colors" />;
                                  if (spec.type === 'select') return <select value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 transition-colors">{spec.options.map(o => <option key={o} value={o}>{o === "" ? "None" : o}</option>)}</select>;
                                  if (spec.type === 'multiselect') {
                                     let currentOptions = spec.options;
                                     if (c._type === 'Hero' && col === 'Faction') {
                                         currentOptions = currentOptions.filter(o => o.toLowerCase() !== 'factionless');
                                     }
                                     const selectedArr = parseCommaList(v).map(s => { const match = currentOptions.find(o => o.toLowerCase() === s); return match || s; });
                                     return (
                                       <select multiple size={4} value={selectedArr} onChange={e => { 
                                           const s = Array.from(e.target.selectedOptions, opt => opt.value); 
                                           if (col === 'Faction') {
                                               const max = c._type === 'Hero' ? 1 : 2;
                                               if (s.length > max) return triggerToast(`Max ${max} faction(s) allowed for ${c._type}.`, true);
                                           }
                                           if (col === 'Compatible Classes' && c._type === 'Skill') {
                                               if (s.length > 3) return triggerToast(`Max 3 compatible classes allowed.`, true);
                                           }
                                           handleInlineChange(c._id, col, s.join(", ")); 
                                       }} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 h-[68px] transition-colors">
                                          {currentOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                       </select>
                                     );
                                  }
                                  if (spec.type === 'number') return <input type="number" step="any" value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full max-w-[100px] bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 transition-colors" />;
                                  return <input type="text" value={v} onChange={e => handleInlineChange(c._id, col, e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded px-2 py-1 text-xs text-slate-200 transition-colors" />;
                                })()
                              ) : (
                                <div title={String(c[col])}>{c[col] !== undefined && c[col] !== "" ? String(c[col]) : <span className="text-slate-600">-</span>}</div>
                              )}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>

          {/* DECK STATS MODAL */}
          {showStatsModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 md:p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-5xl p-0 max-h-[90dvh] flex flex-col shadow-2xl min-w-0">
                <div className="px-4 py-3 md:px-6 md:py-4 border-b border-slate-800 flex justify-between items-start bg-slate-800/40 rounded-t-2xl shrink-0">
                  <div className="min-w-0 pr-4">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h3 className="text-base md:text-xl font-bold text-slate-100">Deck Statistics</h3>
                      <span className="text-xs md:text-sm text-slate-400 font-semibold">({deckAnalytics.cardCount} cards)</span>
                    </div>
                    <div className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-300 font-medium">
                      <span>ℹ️</span>
                      <span><strong>Note:</strong> Analytics evaluate base stats & dice only. Active/passive card abilities, equipment modifiers, and event effects are not yet simulated.</span>
                    </div>
                  </div>
                  <button onClick={() => setShowStatsModal(false)} className="text-slate-400 hover:text-white font-bold text-xl p-1 leading-none rounded hover:bg-slate-700 transition shrink-0">✕</button>
                </div>
                
                <div className="p-4 md:p-6 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 w-full min-w-0">
				<div className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-800/80 p-4 md:p-5 rounded-xl border border-slate-700/50 shadow-inner flex flex-col md:flex-row gap-6 items-center">
                        <div className="text-center md:border-r border-slate-700 md:pr-6 shrink-0 w-full md:w-auto">
                            <h4 className="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1">Overall Competency</h4>
                            <div className="text-4xl font-black text-amber-500">{deckAnalytics.competencyRating}<span className="text-lg text-slate-500">/10</span></div>
                        </div>
                        <div className="flex-1 w-full flex flex-col justify-center">
                            <div className="flex justify-between items-end mb-2">
                                <h4 className="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Deck Archetype</h4>
                                <span className={`text-sm font-black uppercase tracking-wider ${deckAnalytics.archetypeColor}`}>{deckAnalytics.archetypeLabel}</span>
                            </div>
                            <div className="relative w-full h-3 rounded-full bg-gradient-to-r from-rose-500 via-amber-400 to-indigo-500 overflow-hidden shadow-inner">
                                <div className="absolute top-0 bottom-0 w-1 bg-white shadow-[0_0_5px_rgba(0,0,0,0.8)] z-10 transition-all duration-500" style={{ left: `${deckAnalytics.archetypeValue}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[9px] text-slate-500 font-bold uppercase mt-1">
                                <span>Aggro (Fast / Cheap)</span>
                                <span>Moderate</span>
                                <span>Control (Slow / Tanky)</span>
                            </div>
                        </div>
                    </div>
                    <div className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-800/50 p-4 md:p-5 rounded-xl border border-slate-700/50 shadow-inner">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Cost Sustainability</h4>
                        <div className="flex flex-col sm:flex-row gap-4 md:gap-6 items-center justify-around mb-3">
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-amber-500">{deckAnalytics.manaIntake}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Hero Mana Intake</div>
                            </div>
                            <div className="text-lg text-slate-600 font-black">VS</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-blue-400">{deckAnalytics.avgManaCost}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Avg Mana Cost</div>
                            </div>
                            <div className="hidden sm:block text-lg text-slate-700 font-black">|</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-amber-300">{deckAnalytics.avgGoldCost}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Avg Gold Cost</div>
                            </div>
                        </div>
                        <div className={`text-center font-semibold text-xs md:text-sm ${deckAnalytics.sustainColor} bg-slate-900 py-2.5 px-3 rounded-lg border border-slate-800/50 break-words`}>
                            {deckAnalytics.sustainText}
                        </div>
                    </div>

                    <div className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-800/50 p-4 md:p-5 rounded-xl border border-slate-700/50 shadow-inner">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-1 border-b border-slate-700 pb-1.5">Deck Longevity (Breakthrough Defense)</h4>
                        <p className="text-[10px] text-slate-500 font-semibold mb-3 leading-tight">Est. Surviving Turns vs. <strong className="text-amber-500">{deckAnalytics.metaPeakStrike} Meta Strike</strong> (Average Peak Threat of all saved decks)</p>
                        <div className="flex flex-col sm:flex-row gap-4 md:gap-6 items-center justify-around mb-3">
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-rose-400">{deckAnalytics.heroHealth}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Hero Base Health</div>
                            </div>
                            <div className="text-lg text-slate-600 font-black">+</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-amber-500">{deckAnalytics.avgHealth}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Avg Vanguard Health</div>
                            </div>
                            <div className="hidden sm:block text-lg text-slate-700 font-black">|</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-emerald-400">{deckAnalytics.survivingTurns}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Est. Surviving Turns</div>
                            </div>
                        </div>
                        <div className={`text-center font-semibold text-xs md:text-sm ${deckAnalytics.longevityColor} bg-slate-900 py-2.5 px-3 rounded-lg border border-slate-800/50 break-words`}>
                            {deckAnalytics.longevityText}
                        </div>
                    </div>

                    <div className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-800/50 p-4 md:p-5 rounded-xl border border-slate-700/50 shadow-inner">
                        <div className="flex justify-between items-center mb-1 border-b border-slate-700 pb-1.5">
                            <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest">Offensive Output (Expected Strike Damage)</h4>
                            <label className="flex items-center gap-2 cursor-pointer bg-slate-900 px-2 py-1 rounded border border-slate-700 hover:border-slate-500 transition">
                                <span className="text-[10px] font-bold text-slate-300 uppercase">Enable Critical Hits (+25%)</span>
                                <input type="checkbox" checked={statsCritEnabled} onChange={(e) => setStatsCritEnabled(e.target.checked)} className="accent-amber-500 w-3.5 h-3.5" />
                            </label>
                        </div>
                        <p className="text-[10px] text-slate-500 font-semibold mb-3 leading-tight">Comparing your deck's early skirmish power to its late-game finisher ceiling.</p>
                        <div className="flex flex-col sm:flex-row gap-4 md:gap-6 items-center justify-around mb-2">
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-slate-400">{deckAnalytics.overallDeckStrike}</div>
                                <div className="text-xs text-slate-400 uppercase font-bold mt-1">Overall Deck Avg</div>
                            </div>
                            <div className="hidden sm:block text-lg text-slate-700 font-black">➡</div>
                            <div className="text-center">
                                <div className="text-2xl md:text-3xl font-black text-purple-400">{deckAnalytics.peakDeckStrike}</div>
                                <div className="text-xs text-amber-400 uppercase font-bold mt-1">Peak Finisher Avg</div>
                                <div className="text-[9px] text-slate-500 mt-0.5">Top 3 Strongest Attacks</div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Ally Averages</h4>
                        <div className="space-y-3">
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Power:</span>
                                <span className="text-sm md:text-lg font-bold text-rose-400">{deckAnalytics.avgPower}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Ranged Attack:</span>
                                <span className="text-sm md:text-lg font-bold text-purple-400">{deckAnalytics.avgRangedAttack}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Dexterity:</span>
                                <span className="text-sm md:text-lg font-bold text-emerald-400">{deckAnalytics.avgDex}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-300">Health:</span>
                                <span className="text-sm md:text-lg font-bold text-amber-400">{deckAnalytics.avgHealth}</span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800 min-w-0">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Mana / Charge Curve</h4>
                        <div className="pt-1 min-w-0 w-full">
                            {["0-1", "2", "3", "4", "5+"].map(label => (
                                <BarChartRow key={label} label={label} value={deckAnalytics.curve[label]} max={deckAnalytics.maxCurve} color="bg-blue-500" />
                            ))}
                        </div>
                    </div>

                    <div className="bg-slate-800/30 p-4 md:p-5 rounded-xl border border-slate-800 min-w-0">
                        <h4 className="text-xs uppercase font-bold text-slate-400 tracking-widest mb-3 border-b border-slate-700 pb-1.5">Deck Composition</h4>
                        <div className="pt-1 min-w-0 w-full">
                            {["Ally", "Skill", "Equipment", "Flash", "Synergy"].map(label => (
                                <BarChartRow key={label} label={label} value={deckAnalytics.types[label]} max={deckAnalytics.maxType} color="bg-amber-500" />
                            ))}
                        </div>
                    </div>
                </div>
              </div>
            </div>
          )}

          {/* SINGLE CARD MODAL */}
          {modalCard && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 md:p-4 z-[70]">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-5xl p-0 max-h-[95dvh] flex flex-col sm:flex-row shadow-2xl overflow-hidden min-w-0">
				{modalCard["Image URL"] && (
					<div className="w-full sm:w-1/2 h-[30dvh] sm:min-h-[600px] bg-black border-b sm:border-b-0 sm:border-r border-slate-800 flex items-center justify-center p-2 md:p-4 shrink-0">
						<img src={`${formatImageUrl(modalCard["Image URL"])}?t=${Date.now()}`} className="max-w-full max-h-full object-contain drop-shadow-2xl rounded-xl" />
					</div>
				)}
                
                <div className="flex-1 flex flex-col min-w-0 max-h-[60dvh] sm:max-h-[90dvh]">
                  <div className="px-4 py-3 md:px-6 md:py-4 border-b border-slate-800 flex justify-between items-start bg-slate-800/40 shrink-0">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                          <h3 className="text-base md:text-xl font-bold text-slate-100 truncate">{modalCard["Card Name"] || modalCard["Hero Name"]}</h3>
                          <span className={`text-[8px] uppercase font-bold px-1.5 py-0.5 rounded flex items-center gap-1 shrink-0 border ${String(modalCard["Is Official"]) === "true" || modalCard.Creator === 'Gavin' ? 'bg-slate-800 text-slate-400 border-slate-600' : 'bg-purple-900/60 text-purple-300 border-purple-700/50'}`}>
                              {String(modalCard["Is Official"]) === "true" || modalCard.Creator === 'Gavin' ? '🛡️ Official' : '🧪 Community'}
                          </span>
                      </div>
                      <p className="text-xs md:text-sm text-amber-500 font-semibold mt-0.5 truncate">{modalCard._type} • {modalCard["Card Rarity"] || "Common"}</p>
                    </div>
                    <button onClick={() => setModalCard(null)} className="text-slate-400 hover:text-white font-bold text-xl p-1 leading-none rounded hover:bg-slate-700 transition shrink-0 ml-2">✕</button>
                  </div>
                  <div className="p-4 md:p-6 overflow-y-auto space-y-3 text-xs md:text-sm divide-y divide-slate-800/60 flex-1 relative min-w-0">
                    {editMode && view === 'database' && (
                        <div className="absolute top-2 right-4 md:top-4 md:right-6 z-10">
                            <button onClick={() => handleDeleteCard(modalCard._id)} className="px-3 py-1.5 bg-rose-900/40 text-rose-300 text-xs font-bold rounded hover:bg-rose-700 hover:text-white transition">Delete</button>
                        </div>
                    )}
                    {Object.entries(modalCard).map(([key, val]) => {
                      if (key.startsWith('_') || val === "" || val === null || val === undefined || key === "Image URL") return null;
                      return (
                        <div key={key} className="pt-2.5 flex flex-col sm:flex-row sm:justify-between sm:gap-6 gap-1 min-w-0">
                          <span className="text-slate-500 font-medium shrink-0 uppercase tracking-wider text-[10px] sm:text-xs sm:mt-0.5">{key}</span>
                          <span className="text-left sm:text-right text-slate-200 break-words whitespace-pre-wrap flex-1 leading-relaxed min-w-0">
                              {key === 'Abilities' ? renderAbilityText(val) : String(val)}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* USER AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[90]">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl min-w-0">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">👤 Profile Login / Register</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <p className="text-xs text-slate-400 mb-3 leading-relaxed">
                  Enter your username and a private PIN. If this is your first time using this name, your PIN will be saved to secure your account.
                </p>
                {authError && (
                    <div className="mb-3 p-2 rounded bg-rose-950/80 border border-rose-800 text-rose-300 text-xs font-semibold break-words">
                        {authError}
                    </div>
                )}
                <form onSubmit={handleAuthSubmit} className="space-y-3 w-full">
                  <div>
                    <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Username</label>
                    <input type="text" value={authUsername} onChange={e => setAuthUsername(e.target.value)} placeholder="e.g. Gavin" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Secret PIN / Passcode</label>
                    <input type="password" value={authPin} onChange={e => setAuthPin(e.target.value)} placeholder="e.g. 1234" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition shadow-md">
                    Sign In / Register
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
