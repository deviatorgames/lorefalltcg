    function renderAbilityText(text) {
        if (!text) return null;
        const parts = text.split(/(\[Mana:\d+(?:-\d+)?\]|\[Gold:\d+\])/g);
        return parts.map((part, idx) => {
            const mMatch = part.match(/^\[Mana:(\d+(?:-\d+)?)\]$/);
            if (mMatch) {
                return <span key={idx} className="inline-flex items-center justify-center min-w-[20px] px-1 h-5 rounded-full bg-purple-600 text-white text-[10px] font-bold mx-0.5 border border-purple-400 shadow-sm">{mMatch[1]}</span>;
            }
            const gMatch = part.match(/^\[Gold:(\d+)\]$/);
            if (gMatch) {
                return <span key={idx} className="inline-flex items-center justify-center min-w-[20px] px-1 h-5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black mx-0.5 border border-amber-300 shadow-sm">{gMatch[1]}</span>;
            }
            return part;
        });
    }

    function formatImageUrl(url) {
        if (!url) return null;
        let finalUrl = String(url).trim();

        // 1. Detect if it's a GitHub permalink with a 40-character commit hash:
        // e.g. https://github.com/user/repo/blob/1a2b3c4d.../path/image.png
        const commitHashRegex = /github\.com\/([^\/]+)\/([^\/]+)\/blob\/[a-f0-9]{40}\/(.+)/i;
        if (commitHashRegex.test(finalUrl)) {
            finalUrl = finalUrl.replace(commitHashRegex, 'raw.githubusercontent.com/$1/$2/refs/heads/main/$3');
        } else if (finalUrl.includes('github.com') && finalUrl.includes('/blob/')) {
            // Standard branch URL: e.g. github.com/user/repo/blob/main/path/image.png
            finalUrl = finalUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }

        // Clean out existing query params before attaching cache buster
        if (finalUrl.includes('raw.githubusercontent.com')) {
            finalUrl = finalUrl.split('?')[0];
        }

        return finalUrl;
    }

    function buildIndicativeEffect(s, cName) {
      const amt = s.effectAmount;
      if (s.effectType === 'heal') {
        if (s.effectTarget === 'selfHero') return `you gain ${amt} health.`;
        if (s.effectTarget === 'targetCharacter') return `target character gains ${amt} health.`;
        if (s.effectTarget === 'targetAlly') return `target ally gains ${amt} health.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `target ally you control gains ${amt} health.`;
        if (s.effectTarget === 'targetEnemyAlly') return `target enemy ally gains ${amt} health.`;
        return `${cName} gains ${amt} health.`;
      }
      if (s.effectType === 'draw') {
        return amt === 1 ? "draw a card." : `draw ${amt} cards.`;
      }
      if (s.effectType === 'mana') {
        return `you gain ${amt} mana.`;
      }
      if (s.effectType === 'charge') {
        if (s.effectTarget === 'deplete') return `deplete ${amt} charge from it.`;
        if (s.effectTarget === 'targetAllyOrSkill') return `target ally or skill gains ${amt} charge.`;
        if (s.effectTarget === 'targetSkill') return `target skill gains ${amt} charge.`;
        if (s.effectTarget === 'targetRangedSkill') return `target ranged skill gains ${amt} charge.`;
        if (s.effectTarget === 'targetAlly') return `target ally gains ${amt} charge.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `target ally you control gains ${amt} charge.`;
        return `${cName} gains ${amt} charge.`;
      }
      if (s.effectType === 'damage') {
        if (s.effectTarget === 'allAllies') return `deals ${amt} non-combat damage to all allies in play.`;
        if (s.effectTarget === 'targetEnemyAlly') return `deals ${amt} non-combat damage to target enemy ally.`;
        if (s.effectTarget === 'targetCharacter') return `deals ${amt} non-combat damage to target character.`;
        return `deals ${amt} non-combat damage to target ally.`;
      }
      if (s.effectType === 'lose_health') {
        if (s.effectTarget === 'targetEnemyAlly') return `target enemy ally loses ${amt} health.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `target ally you control loses ${amt} health.`;
        return `target character loses ${amt} health.`;
      }
      if (s.effectType === 'stat_buff') {
        const dur = s.effectDuration === 'thisStrike' ? 'this strike' : (s.effectDuration === 'permanent' ? '' : 'this turn');
        const statName = s.effectStat === 'rangedAttack' ? 'ranged attack' : (s.effectStat === 'maxHealth' ? 'max health' : (s.effectStat === 'accuracy' ? 'to accuracy rolls' : s.effectStat));
        let tgtPrefix = `${cName} gets`;
        if (s.effectTarget === 'selfHero') tgtPrefix = 'You get';
        else if (s.effectTarget === 'targetCharacter') tgtPrefix = 'Target character gets';
        else if (s.effectTarget === 'targetAlly') tgtPrefix = 'Target ally gets';
        else if (s.effectTarget === 'targetFriendlyAlly') tgtPrefix = 'Target ally you control gets';
        else if (s.effectTarget === 'allFriendlyDefending') tgtPrefix = 'Defending allies you control get';
        return `${tgtPrefix} +${amt} ${statName}${dur ? ' ' + dur : ''}.`;
      }
      if (s.effectType === 'keyword_grant') {
        const dur = s.effectDuration === 'thisStrike' ? 'this strike' : (s.effectDuration === 'permanent' ? '' : 'this turn');
        const kw = s.effectKeyword || 'Freeze';
        if (kw === 'Chance for Critical') {
          return s.effectTarget === 'selfHero' ? `you get chance for critical ${dur}.` : `target character gets chance for critical ${dur}.`;
        }
        if (kw === 'Chance for Evasion') {
          return s.effectTarget === 'selfHero' ? `you get chance for evasion ${dur}.` : `target character gets chance for evasion ${dur}.`;
        }
        if (kw === 'Advantage') {
          return s.effectTarget === 'selfHero' || s.effectTarget === 'self' ? `user has advantage.` : `target character has advantage ${dur}.`;
        }
        if (kw === 'Double Advantage') {
          return `roll with double advantage.`;
        }
        if (kw === 'Freeze') {
          return `Freeze (Roll for chance. If successful, defending enemy is exhausted until your next turn.)`;
        }
        if (kw === 'Knockback') {
          return `target has knockback this strike.`;
        }
        if (kw === 'Overreach') {
          return `${cName} has overreach ${dur}.`;
        }
        if (kw === 'Piercing') {
          return `target character gets Piercing ${dur}.`;
        }
        if (kw === 'Pierce Proof') {
          return `target character gets Pierce Proof ${dur}.`;
        }
        if (kw === 'Leach') {
          return `you have Leach ${dur}.`;
        }
        if (kw === 'Poison') {
          return `Poison (Defending enemy takes 2 non-combat damage at the start of their turn.)`;
        }
        if (kw === 'Curse') {
          return `target character is cursed.`;
        }
        if (kw === 'Aptitude') {
          return `${cName} gets Aptitude.`;
        }
        if (kw === 'Allegiance') {
          return `Allegiance (All other characters of the same class get advantage.)`;
        }
        if (kw === 'Overcharge') {
          return `${cName} gets Overcharge.`;
        }
        return `target character gets ${kw} ${dur}.`;
      }
      if (s.effectType === 'token') {
        return `you get ${amt} ${s.tokenName} Token${amt > 1 ? 's' : ''}.`;
      }
      if (s.effectType === 'force_chance') {
        return `target wins chance roll this turn.`;
      }
      if (s.effectType === 'look_loot') {
        if (s.lootAction === 'reveal_skill') return `look at the top ${s.lootCardsCount} cards of your Loot. You may reveal a Skill card from among them and put it into your hand.`;
        if (s.lootAction === 'search_level') return `search your loot for a skill 1 level higher than those and put it into your hand. Shuffle your loot.`;
        return `look at the top ${s.lootCardsCount === 1 ? 'card' : s.lootCardsCount + ' cards'} of your loot. You may put that card into your hand.`;
      }
      if (s.effectType === 'attack_die') {
        return `${cName}'s attack is ${s.attackDieValue}.`;
      }
      if (s.effectType === 're_roll') {
        return `roll again and your original roll is null.`;
      }
      if (s.effectType === 'repeat_roll') {
        let stopStr = `until you fail or until you succeed ${s.repeatMaxCount || 5} times`;
        if (s.repeatStopCondition === 'until_fail') stopStr = 'until you fail';
        else if (s.repeatStopCondition === 'until_success') stopStr = `until you succeed ${s.repeatMaxCount || 1} times`;
        let outcomeStr = "";
        if (s.repeatSuccessOutcome === 'deals_ranged_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals it's ranged attack damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'deals_combat_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals it's combat damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'deals_noncombat_damage' || s.repeatSuccessOutcome === 'deal_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals ${s.effectAmount || 1} non-combat damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'gain_charge') {
          outcomeStr = ` For each successful roll, target gains 1 charge.`;
        }
        let consequenceStr = "";
        if (s.strikeConsequence === 'ends_combat_phase') {
          consequenceStr = ` Striking with ${cName} ends your combat phase.`;
        } else if (s.strikeConsequence === 'exhausts_hero') {
          consequenceStr = ` Striking with ${cName} exhausts your hero.`;
        } else if (s.strikeConsequence === 'sacrifice_strikes') {
          consequenceStr = ` Striking with ${cName} sacrifices your remaining strikes.`;
        }
        return `keep rolling ${stopStr}.${outcomeStr}${consequenceStr}`;
      }
      if (s.effectType === 'custom') {
        let eff = (s.customEffectText || "").trim();
        if (eff && !eff.endsWith('.')) eff += '.';
        return eff;
      }
      return "";
    }

    function buildInfinitiveEffect(s, cName) {
      const amt = s.effectAmount;
      if (s.effectType === 'heal') {
        if (s.effectTarget === 'selfHero') return `gain ${amt} health.`;
        if (s.effectTarget === 'targetCharacter') return `have target character gain ${amt} health.`;
        if (s.effectTarget === 'targetAlly') return `have target ally gain ${amt} health.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `have target ally you control gain ${amt} health.`;
        if (s.effectTarget === 'targetEnemyAlly') return `have target enemy ally gain ${amt} health.`;
        return `have ${cName} gain ${amt} health.`;
      }
      if (s.effectType === 'draw') {
        return amt === 1 ? "draw a card." : `draw ${amt} cards.`;
      }
      if (s.effectType === 'mana') {
        return `gain ${amt} mana.`;
      }
      if (s.effectType === 'charge') {
        if (s.effectTarget === 'deplete') return `deplete ${amt} charge from it.`;
        if (s.effectTarget === 'targetAllyOrSkill') return `have target ally or skill gain ${amt} charge.`;
        if (s.effectTarget === 'targetSkill') return `have target skill gain ${amt} charge.`;
        if (s.effectTarget === 'targetRangedSkill') return `have target ranged skill gain ${amt} charge.`;
        if (s.effectTarget === 'targetAlly') return `have target ally gain ${amt} charge.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `have target ally you control gain ${amt} charge.`;
        return `have ${cName} gain ${amt} charge.`;
      }
      if (s.effectType === 'damage') {
        if (s.effectTarget === 'allAllies') return `deal ${amt} non-combat damage to all allies in play.`;
        if (s.effectTarget === 'targetEnemyAlly') return `deal ${amt} non-combat damage to target enemy ally.`;
        if (s.effectTarget === 'targetCharacter') return `deal ${amt} non-combat damage to target character.`;
        return `deal ${amt} non-combat damage to target ally.`;
      }
      if (s.effectType === 'lose_health') {
        if (s.effectTarget === 'targetEnemyAlly') return `have target enemy ally lose ${amt} health.`;
        if (s.effectTarget === 'targetFriendlyAlly') return `have target ally you control lose ${amt} health.`;
        return `have target character lose ${amt} health.`;
      }
      if (s.effectType === 'stat_buff') {
        const dur = s.effectDuration === 'thisStrike' ? 'this strike' : (s.effectDuration === 'permanent' ? '' : 'this turn');
        const statName = s.effectStat === 'rangedAttack' ? 'ranged attack' : (s.effectStat === 'maxHealth' ? 'max health' : (s.effectStat === 'accuracy' ? 'to accuracy rolls' : s.effectStat));
        let tgt = 'target character';
        if (s.effectTarget === 'selfHero') tgt = 'yourself';
        else if (s.effectTarget === 'targetAlly') tgt = 'target ally';
        else if (s.effectTarget === 'targetFriendlyAlly') tgt = 'target ally you control';
        else if (s.effectTarget === 'allFriendlyDefending') tgt = 'defending allies you control';
        else if (s.effectTarget === 'self') tgt = cName;
        return `give ${tgt} +${amt} ${statName}${dur ? ' ' + dur : ''}.`;
      }
      if (s.effectType === 'keyword_grant') {
        const dur = s.effectDuration === 'thisStrike' ? 'this strike' : (s.effectDuration === 'permanent' ? '' : 'this turn');
        const kw = s.effectKeyword || 'Freeze';
        if (kw === 'Chance for Critical') return `grant target character chance for critical ${dur}.`;
        if (kw === 'Chance for Evasion') return `grant target character chance for evasion ${dur}.`;
        if (kw === 'Advantage') return `grant user advantage ${dur}.`;
        if (kw === 'Double Advantage') return `roll with double advantage.`;
        if (kw === 'Freeze') return `freeze defending enemy (Roll for chance. If successful, defending enemy is exhausted until your next turn.)`;
        if (kw === 'Knockback') return `grant target knockback this strike.`;
        return `grant target character ${kw} ${dur}.`;
      }
      if (s.effectType === 'token') {
        return `summon ${amt === 1 ? 'a ' + s.tokenName : amt + ' ' + s.tokenName} Token${amt > 1 ? 's' : ''}.`;
      }
      if (s.effectType === 'force_chance') {
        return `have target win chance roll this turn.`;
      }
      if (s.effectType === 'look_loot') {
        if (s.lootAction === 'reveal_skill') return `look at the top ${s.lootCardsCount} cards of your Loot. You may reveal a Skill card from among them and put it into your hand.`;
        if (s.lootAction === 'search_level') return `search your loot for a skill 1 level higher than those and put it into your hand. Shuffle your loot.`;
        return `look at the top ${s.lootCardsCount === 1 ? 'card' : s.lootCardsCount + ' cards'} of your loot. You may put that card into your hand.`;
      }
      if (s.effectType === 'attack_die') {
        return `have ${cName}'s attack be ${s.attackDieValue}.`;
      }
      if (s.effectType === 're_roll') {
        return `roll again and your original roll is null.`;
      }
      if (s.effectType === 'repeat_roll') {
        let stopStr = `until you fail or until you succeed ${s.repeatMaxCount || 5} times`;
        if (s.repeatStopCondition === 'until_fail') stopStr = 'until you fail';
        else if (s.repeatStopCondition === 'until_success') stopStr = `until you succeed ${s.repeatMaxCount || 1} times`;
        let outcomeStr = "";
        if (s.repeatSuccessOutcome === 'deals_ranged_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals it's ranged attack damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'deals_combat_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals it's combat damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'deals_noncombat_damage' || s.repeatSuccessOutcome === 'deal_damage') {
          outcomeStr = ` For each successful roll, ${cName} deals ${s.effectAmount || 1} non-combat damage to targeted character.`;
        } else if (s.repeatSuccessOutcome === 'gain_charge') {
          outcomeStr = ` For each successful roll, target gains 1 charge.`;
        }
        let consequenceStr = "";
        if (s.strikeConsequence === 'ends_combat_phase') {
          consequenceStr = ` Striking with ${cName} ends your combat phase.`;
        } else if (s.strikeConsequence === 'exhausts_hero') {
          consequenceStr = ` Striking with ${cName} exhausts your hero.`;
        } else if (s.strikeConsequence === 'sacrifice_strikes') {
          consequenceStr = ` Striking with ${cName} sacrifices your remaining strikes.`;
        }
        return `keep rolling ${stopStr}.${outcomeStr}${consequenceStr}`;
      }
      if (s.effectType === 'custom') {
        let eff = (s.customEffectText || "").trim();
        if (eff && !eff.endsWith('.')) eff += '.';
        return eff;
      }
      return "";
    }

    function generateAbilityTextFromState(s, cardName) {
      const cName = (cardName || "").trim() || "This character";
      const cap = str => str ? str.charAt(0).toUpperCase() + str.slice(1) : "";

      if (s.category === 'keyword') {
        return KEYWORD_DEFINITIONS[s.selectedKeyword]?.fullText || s.selectedKeyword;
      }

      const indicative = buildIndicativeEffect(s, cName);
      const infinitive = buildInfinitiveEffect(s, cName);

      // Base action phrasing respecting optional "you may..." and inline chance rolls
      let baseEffect = indicative;
      if (s.isChanceRoll && s.chanceStyle === 'infinitive') {
        baseEffect = `they roll for chance to ${infinitive}`;
      } else if (s.isOptional && !s.actIsVariableMana) {
        baseEffect = `you may ${infinitive}`;
      }

      // If Condition Integration
      let fullOutcome = "";
      if (s.effectCondition === 'if_you_do') {
        if (s.actIsVariableMana) {
          const maxS = s.actVariableMax || 3;
          const spendClause = s.isOptional ? `you may spend 1 mana up to ${maxS} times.` : `spend 1 mana up to ${maxS} times.`;
          
          let perPhrase = "";
          if (s.referringAction === 'mana_spent') perPhrase = " for each mana that was spent";
          else if (s.referringAction === 'gold_spent') perPhrase = " for each gold that was spent";
          else if (s.referringAction === 'charge_spent') perPhrase = " for each charge spent";
          else if (s.referringAction === 'soldiers_controlled') perPhrase = " for every soldier you control in play";
          else if (s.referringAction === 'allies_controlled') perPhrase = " for every ally you control in play";
          else if (s.referringAction === 'counters_on_it') perPhrase = " for every counter on it";
          else if (s.referringAction === 'damage_dealt') perPhrase = " equal to combat damage dealt";
          else if (s.referringAction === 'attack_roll') perPhrase = " equal to the attack roll";

          let notePhrase = "";
          if (s.conditionNote === 'single_trigger') notePhrase = " All health gained this way counts as 1 trigger.";
          else if (s.conditionNote === 'null_original') notePhrase = " Your original roll is null.";
          else if (s.conditionNote === 'reroll_once') notePhrase = " You can only re-roll once.";

          fullOutcome = `${spendClause} If you do, ${indicative.replace(/\.$/, '')}${perPhrase}.${notePhrase}`;
        } else {
          let followUp = "";
          if (s.referringAction === 'sacrifice_strike') {
            followUp = " If you do, sacrifice your third strike.";
          } else if (s.referringAction === 'hp_lost') {
            const whoLoses = (cName === 'This character' || s.trigHealSubject === 'hero') ? 'you lose' : `${cName} loses`;
            followUp = ` If you do, ${whoLoses} the health gained, otherwise put the card on the bottom of your loot.`;
          } else if (s.referringAction === 'mana_spent') {
            followUp = ` If you do, ${indicative.replace(/\.$/, '')} for each mana that was spent.`;
          } else if (s.referringAction !== 'none') {
            followUp = ` If you do, ${indicative}`;
          } else {
            followUp = ` If you do, ${indicative}`;
          }
          fullOutcome = `${baseEffect.replace(/\.$/, '')}.${followUp}`;
        }
      } else if (s.effectCondition === 'if_chance_success') {
        fullOutcome = `Roll for chance. If successful, ${indicative}`;
      } else if (s.effectCondition === 'if_chance_win') {
        fullOutcome = `Roll for chance. If you win, ${indicative}`;
      } else if (s.effectCondition === 'if_defeated_enemy') {
        fullOutcome = `If you defeated an enemy ally this turn, ${indicative}`;
      } else if (s.effectCondition === 'if_enemy_noncombat') {
        fullOutcome = `If an enemy took non-combat damage this turn, ${indicative}`;
      } else if (s.effectCondition === 'if_struck_twice') {
        const secPart = s.referringAction === 'sacrifice_strike' ? `${baseEffect.replace(/\.$/, '')}. If you do, sacrifice your third strike.` : baseEffect;
        fullOutcome = `If you have struck twice this turn, ${secPart}`;
      } else if (s.effectCondition === 'if_roll_one') {
        fullOutcome = `If you roll a 1, ${baseEffect}`;
      } else if (s.effectCondition === 'if_charge_count') {
        fullOutcome = `If ${cName} has ${s.condChargeThreshold || 5} charge, ${indicative}`;
      } else if (s.effectCondition === 'if_target_class') {
        fullOutcome = `If target is a ${(s.condClass || 'Mage').toLowerCase()}, ${indicative}`;
      } else if (s.effectCondition === 'if_user_equipped') {
        fullOutcome = `If user has ${s.condEquipType || 'a dagger'} equipped, ${indicative}`;
      } else if (s.effectCondition === 'custom') {
        const cTxt = (s.customConditionText || "").trim();
        fullOutcome = `${cTxt ? cTxt + ', ' : ''}${indicative}`;
      } else {
        // No If Condition specified
        if (s.isChanceRoll) {
          if (s.chanceStyle === 'if_successful') fullOutcome = `Roll for chance. If successful, ${indicative}`;
          else if (s.chanceStyle === 'if_win') fullOutcome = `Roll for chance. If you win, ${indicative}`;
          else fullOutcome = baseEffect;
        } else {
          fullOutcome = baseEffect;
        }
      }

      if (s.strikeConsequence && s.strikeConsequence !== 'none' && s.effectType !== 'repeat_roll') {
        let consequenceStr = "";
        if (s.strikeConsequence === 'ends_combat_phase') consequenceStr = ` Striking with ${cName} ends your combat phase.`;
        else if (s.strikeConsequence === 'exhausts_hero') consequenceStr = ` Striking with ${cName} exhausts your hero.`;
        else if (s.strikeConsequence === 'sacrifice_strikes') consequenceStr = ` Striking with ${cName} sacrifices your remaining strikes.`;
        fullOutcome = `${fullOutcome.replace(/\.$/, '')}.${consequenceStr}`;
      }

      // 1. ACTIVATED ABILITIES
      if (s.category === 'activated') {
        let costTag = "";
        if (s.actIsVariableMana) {
          costTag = `[Mana:${s.actManaCost || 1}-${s.actVariableMax || 3}] `;
        } else if (s.actCostType === 'mana') costTag = `[Mana:${s.actManaCost}] `;
        else if (s.actCostType === 'gold') costTag = `[Gold:${s.actGoldCost}] `;
        else if (s.actCostType === 'exhaust') costTag = s.actExhaustTarget === 'hero' ? 'Exhaust your hero: ' : `Exhaust ${cName}: `;
        else if (s.actCostType === 'mana_exhaust') costTag = `[Mana:${s.actManaCost}] Exhaust ${cName}: `;
        else if (s.actCostType === 'gold_exhaust') costTag = `[Gold:${s.actGoldCost}] Exhaust ${cName}: `;

        let timingTag = "";
        if (s.actPhase === 'command') {
          timingTag = s.actFrequency === 'once' ? "Once per turn during your command phase, " : "During your command phase, ";
        } else if (s.actPhase === 'combat') {
          timingTag = s.actFrequency === 'once' ? "Once per turn during your combat phase, " : "During your combat phase, ";
        } else {
          if (s.actFrequency === 'once' && !costTag.includes('Exhaust')) timingTag = "Once per turn, ";
          else if (s.actFrequency === 'twice') timingTag = "Up to twice per turn, ";
        }

        return `${costTag}${timingTag}${cap(fullOutcome)}`.trim();
      }

      // 2. TRIGGERED PASSIVES
      if (s.category === 'triggered') {
        if (s.trigEvent === 'onPlay') {
          let subj = cName;
          if (s.trigSubject === 'friendlyAlly') subj = "an ally you control";
          else if (s.trigSubject === 'anyAlly') subj = "an ally";

          let loc = "comes into play";
          if (s.trigZone === 'battleZone') loc = "is played to the battle zone";
          else if (s.trigZone === 'bench') loc = "is played to your bench";
          else if (s.trigZone === 'skillSlot') loc = "is played to a skill slot";
          else if (s.trigZone === 'any' && subj === cName) loc = "is played";

          return `When ${subj} ${loc}, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onDefeat') {
          let who = cName;
          if (s.trigSubject === 'friendlyAlly') who = "an ally you control";
          else if (s.trigSubject === 'anyAlly') who = "any ally";
          else if (s.trigSubject === 'enemyAlly') who = "an enemy ally";
          else if (s.trigSubject === 'enemyHero') who = "an enemy hero";

          let loc = "";
          if (s.trigZone === 'battleZone') loc = " from the battle zone";
          else if (s.trigZone === 'bench') loc = " from the bench";

          return `When ${who} is defeated${loc}, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onStrike') {
          if (s.trigStrikeZone === 'bench') {
            return `${cName} attacks on strike ${s.trigStrikeNum} from your bench: ${cap(fullOutcome)}`;
          }
          return `Strike ${s.trigStrikeNum}: ${cap(fullOutcome)}`;
        }

        if (s.trigEvent === 'onDamageDealt') {
          let src = cName;
          if (s.trigDamageSource === 'friendlyAlly') src = "an ally you control";
          else if (s.trigDamageSource === 'hero') src = "you";

          let victim = "an enemy";
          if (s.trigDamageVictim === 'enemyHero') victim = "a hero";
          else if (s.trigDamageVictim === 'enemyAlly') victim = "an enemy ally";

          let cond = "";
          if (s.trigDamageWeapon === 'dagger') cond = " and user has a dagger equipped";
          else if (s.trigDamageWeapon === 'withSkill') cond = ` with ${cName}`;

          const verb = src === 'you' ? 'deal' : 'deals';
          return `Whenever ${src} ${verb} combat damage to ${victim}${cond}, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onDamageTaken') {
          let subj = `${cName} takes`;
          if (s.trigSubject === 'hero') subj = "your hero takes";
          else if (s.trigSubject === 'friendlyAlly') subj = "an ally you control takes";
          return `Whenever ${subj} combat damage, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onHeal') {
          if (s.trigHealSubject === 'friendlyAlly') return `Whenever an ally you control gains health, ${fullOutcome}`;
          if (s.trigHealSubject === 'character') return `Whenever a character gains health, ${fullOutcome}`;
          return `Whenever you gain health, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onDraw') {
          if (s.trigDrawSource === 'turnStart') return `At the start of your turn after drawing, ${fullOutcome}`;
          if (s.trigDrawSource === 'any') return `Whenever you draw a card, ${fullOutcome}`;
          return `Whenever you draw a card from an ability, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onChanceWin') {
          if (s.trigChanceEvent === 'roll') return `Whenever you roll for chance, ${fullOutcome}`;
          return `Whenever you win a chance roll, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onCounterstrike') {
          if (s.trigCounterstrikeWho === 'you') return `Whenever you counterstrike, ${fullOutcome}`;
          if (s.trigCounterstrikeWho === 'defending') return `Whenever ${cName} counterstrikes, ${fullOutcome}`;
          return `Whenever a character counterstrikes, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onTurnStart') {
          if (s.trigTurnPhase === 'turnEnd') return `At the end of your turn, ${fullOutcome}`;
          if (s.trigTurnPhase === 'command') return `At the start of your command phase, ${fullOutcome}`;
          if (s.trigTurnPhase === 'combat') return `At the start of your combat phase, ${fullOutcome}`;
          return `At the start of your turn, ${fullOutcome}`;
        }

        if (s.trigEvent === 'onAccuracyRoll') {
          let subj = cName;
          if (s.trigSubject === 'hero') subj = "your hero";
          else if (s.trigSubject === 'friendlyAlly') subj = "an ally you control";
          return `When rolling accuracy for ${subj}, ${fullOutcome}`;
        }
      }

      // 3. STATIC / CONTINUOUS
      if (s.category === 'static') {
        if (s.staticConditionMode === 'always') return cap(fullOutcome);

        if (s.staticConditionMode === 'zone_role') {
          if (s.staticZoneRole === 'bench_strike') {
            return `${cName} can strike from your bench.`;
          }
          if (s.staticZoneRole === 'vanguard') {
            return `All ${(s.staticClass || 'soldier').toLowerCase()}s you control have +${s.effectAmount || 1} ${s.effectStat || 'power'} as long as ${cName} is your Vanguard.`;
          }
          if (s.staticZoneRole === 'bench') {
            return `${cName} has +${s.effectAmount || 1} ${s.effectStat || 'defense'} while on your bench.`;
          }
          if (s.staticZoneRole === 'defending') {
            return `Defending allies you control get +${s.effectAmount || 1} ${s.effectStat || 'defense'} this turn.`;
          }
        }

        if (s.staticConditionMode === 'control_synergy') {
          if (s.staticSynergyType === 'another_class') {
            return `${cName} has D6 attack as long as you control another ${(s.staticClass || 'soldier').toLowerCase()}.`;
          }
          if (s.staticSynergyType === 'all_class') {
            return `All ${(s.staticClass || 'soldier').toLowerCase()}s you control have +${s.effectAmount || 1} ${s.effectStat || 'power'}.`;
          }
          if (s.staticSynergyType === 'other_race') {
            return `Other ${(s.staticRace || 'elf').toLowerCase()}s you control get +${s.effectAmount || 1} ${s.effectStat || 'ranged attack'}.`;
          }
          if (s.staticSynergyType === 'allegiance') {
            return `Allegiance (All other characters of the same class get advantage.)`;
          }
        }

        if (s.staticConditionMode === 'combat_precondition') {
          if (s.staticPrecondition === 'enemy_defeated') {
            return `If you defeated an enemy ally this turn, ${cName} has ${s.effectKeyword ? s.effectKeyword.toLowerCase() : 'overreach'}.`;
          }
          if (s.staticPrecondition === 'enemy_noncombat') {
            return `If an enemy took non-combat damage this turn, ${cName}'s attack is D8.`;
          }
          if (s.staticPrecondition === 'struck_twice') {
            return `If you have struck twice this turn, ${fullOutcome}`;
          }
          if (s.staticPrecondition === 'won_chance') {
            return `If you win a chance roll, ${cName}'s attack is D8 and they get advantage this turn.`;
          }
        }

        if (s.staticConditionMode === 'scaling') {
          if (s.staticScaling === 'per_charge') {
            return `${cName} gets +${s.effectAmount || 1} ${s.effectStat || 'ranged attack'} for every charge on it.`;
          }
          if (s.staticScaling === 'discard_count') {
            return `${cName}'s ranged attack is equal to the total number of allies, skills, and synergies in your discard pile.`;
          }
        }
      }

      // 4. SKILL PROFICIENCY
      if (s.category === 'proficiency') {
        return `Proficiency ${s.profLevel}: ${cap(fullOutcome)}`;
      }

      return cap(fullOutcome);
    }

    function analyzeAbilityForEngine(text) {
      if (!text || !text.trim()) {
        return { recognized: false, badges: [] };
      }
      const t = text.trim();
      const badges = [];

      // Cost detection
      const mMatch = t.match(/\[Mana:\s*(\d+)(?:-(\d+))?\]/i) || t.match(/Pay\s+(\d+)\s+mana/i);
      if (mMatch) {
        badges.push({ label: mMatch[2] ? `[Mana: ${mMatch[1]}-${mMatch[2]} Variable Spend]` : `[Mana: ${mMatch[1]}]`, color: 'bg-purple-900/80 text-purple-200 border-purple-600' });
      }
      const gMatch = t.match(/\[Gold:\s*(\d+)\]/i) || t.match(/Pay\s+(\d+)\s+gold/i);
      if (gMatch) {
        badges.push({ label: `[Gold: ${gMatch[1]}]`, color: 'bg-amber-900/80 text-amber-200 border-amber-600' });
      }
      if (/Exhaust\b/i.test(t)) {
        badges.push({ label: 'Cost: Exhaust Unit', color: 'bg-indigo-900/80 text-indigo-200 border-indigo-600' });
      }

      // Trigger detection
      if (/When .* (?:comes into play|is played)/i.test(t)) badges.push({ label: 'Trigger: On Play (ETB)', color: 'bg-emerald-900/80 text-emerald-200 border-emerald-600' });
      else if (/When .* is defeated/i.test(t)) badges.push({ label: 'Trigger: On Defeat (Death)', color: 'bg-rose-900/80 text-rose-200 border-rose-600' });
      else if (/Strike\s+(\d+)\s*:/i.test(t)) {
        const s = t.match(/Strike\s+(\d+)\s*:/i);
        badges.push({ label: `Trigger: Strike ${s[1]}`, color: 'bg-orange-900/80 text-orange-200 border-orange-600' });
      } else if (/Whenever .* deals? combat damage/i.test(t)) badges.push({ label: 'Trigger: On Combat Damage', color: 'bg-red-900/80 text-red-200 border-red-600' });
      else if (/Whenever .* takes? combat damage/i.test(t)) badges.push({ label: 'Trigger: On Damage Taken', color: 'bg-red-900/80 text-red-200 border-red-600' });
      else if (/Whenever .* counterstrikes/i.test(t)) badges.push({ label: 'Trigger: On Counterstrike', color: 'bg-yellow-900/80 text-yellow-200 border-yellow-600' });
      else if (/Whenever .* gains? health/i.test(t)) badges.push({ label: 'Trigger: On Health Gain', color: 'bg-emerald-900/80 text-emerald-200 border-emerald-600' });
      else if (/Whenever you draw/i.test(t)) badges.push({ label: 'Trigger: On Draw Card', color: 'bg-sky-900/80 text-sky-200 border-sky-600' });
      else if (/Whenever you win a chance roll/i.test(t)) badges.push({ label: 'Trigger: On Chance Win', color: 'bg-amber-900/80 text-amber-200 border-amber-600' });
      else if (/At the start of your turn/i.test(t)) badges.push({ label: 'Trigger: Turn Start', color: 'bg-blue-900/80 text-blue-200 border-blue-600' });
      else if (/When rolling accuracy/i.test(t)) badges.push({ label: 'Trigger: On Accuracy Roll', color: 'bg-amber-900/80 text-amber-200 border-amber-600' });
      else if (/Proficiency\s+(\d+)\s*:/i.test(t)) {
        const p = t.match(/Proficiency\s+(\d+)\s*:/i);
        badges.push({ label: `Tier: Proficiency ${p[1]}`, color: 'bg-purple-900/80 text-purple-200 border-purple-600' });
      }

      // Zone & Role detection
      if (/is your Vanguard/i.test(t)) badges.push({ label: 'Zone: Frontline Vanguard', color: 'bg-blue-900/80 text-blue-200 border-blue-600' });
      if (/from your bench/i.test(t) || /while on your bench/i.test(t)) badges.push({ label: 'Zone: Bench Position', color: 'bg-teal-900/80 text-teal-200 border-teal-600' });
      if (/to the battle zone/i.test(t)) badges.push({ label: 'Zone: Battle Zone ETB', color: 'bg-cyan-900/80 text-cyan-200 border-cyan-600' });

      // Modality & If/Then detection
      if (/\byou may\b/i.test(t)) badges.push({ label: 'Permission: Optional (You May)', color: 'bg-amber-950 text-amber-300 border-amber-700' });
      if (/spend 1 mana up to \d+ times\. If you do/i.test(t)) badges.push({ label: 'If: Variable Spend ("If you do")', color: 'bg-purple-950 text-purple-300 border-purple-600' });
      else if (/If you do\b/i.test(t)) badges.push({ label: 'If: "If you do"', color: 'bg-purple-950 text-purple-300 border-purple-600' });
      if (/if you defeated an enemy/i.test(t)) badges.push({ label: 'If: Defeated Enemy', color: 'bg-rose-950 text-rose-300 border-rose-600' });
      if (/if you have struck twice/i.test(t)) badges.push({ label: 'If: Struck Twice', color: 'bg-orange-950 text-orange-300 border-orange-600' });
      if (/sacrifice your third strike/i.test(t)) badges.push({ label: 'Cost: Sacrifice Strike', color: 'bg-red-950 text-red-300 border-red-600' });
      if (/if successful/i.test(t) || /if you win/i.test(t)) badges.push({ label: 'If: Chance Success', color: 'bg-amber-950 text-amber-300 border-amber-600' });

      // Actions & Keywords
      if (/\bgains?\s+\d+\s+health\b|\bheal\b/i.test(t)) badges.push({ label: 'Action: Heal HP', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/\bdraw\s+(?:a|\d+)\s+cards?\b/i.test(t)) badges.push({ label: 'Action: Draw Card', color: 'bg-sky-950 text-sky-300 border-sky-700' });
      if (/\bgains?\s+\d+\s+charge\b/i.test(t)) badges.push({ label: 'Action: +Charge ⚡', color: 'bg-amber-950 text-amber-300 border-amber-700' });
      if (/\bdeplete\s+\d+\s+charge\b/i.test(t)) badges.push({ label: 'Action: -Deplete Charge', color: 'bg-slate-800 text-slate-300 border-slate-600' });
      if (/\bdeals?\s+\d+\s+(?:non-combat\s+)?damage\b/i.test(t)) badges.push({ label: 'Action: Non-Combat DMG', color: 'bg-rose-950 text-rose-300 border-rose-700' });
      if (/deals\s+it'?s\s+ranged\s+attack\s+damage/i.test(t)) badges.push({ label: 'Outcome: Ranged Attack DMG', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/deals\s+it'?s\s+combat\s+damage/i.test(t)) badges.push({ label: 'Outcome: Combat DMG', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/Striking\s+with.*ends\s+your\s+combat\s+phase/i.test(t)) badges.push({ label: 'Consequence: Ends Combat Phase 🛑', color: 'bg-rose-950 text-rose-300 border-rose-700' });
      if (/keep rolling until you fail/i.test(t)) badges.push({ label: 'Action: Cascade / Repeat Roll 🎯', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/\bTokens?\b/i.test(t)) badges.push({ label: 'Action: Summon Token', color: 'bg-indigo-950 text-indigo-300 border-indigo-700' });
      if (/look at the top/i.test(t) || /search your loot/i.test(t)) badges.push({ label: 'Action: Loot Deck Search', color: 'bg-sky-900/80 text-sky-200 border-sky-600' });
      if (/advantage/i.test(t)) badges.push({ label: 'Keyword: Advantage', color: 'bg-amber-950 text-amber-300 border-amber-700' });
      if (/Freeze/i.test(t)) badges.push({ label: 'Keyword: Freeze', color: 'bg-cyan-950 text-cyan-300 border-cyan-700' });
      if (/Piercing/i.test(t)) badges.push({ label: 'Keyword: Piercing', color: 'bg-slate-800 text-slate-200 border-slate-600' });
      if (/Pierce Proof/i.test(t)) badges.push({ label: 'Keyword: Pierce Proof', color: 'bg-slate-800 text-slate-200 border-slate-600' });
      if (/Knockback/i.test(t)) badges.push({ label: 'Keyword: Knockback', color: 'bg-orange-950 text-orange-300 border-orange-700' });
      if (/Overreach/i.test(t)) badges.push({ label: 'Keyword: Overreach', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/Leach/i.test(t)) badges.push({ label: 'Keyword: Leach', color: 'bg-emerald-950 text-emerald-300 border-emerald-700' });
      if (/Poison/i.test(t)) badges.push({ label: 'Keyword: Poison', color: 'bg-green-950 text-green-300 border-green-700' });
      if (/cursed|Curse/i.test(t)) badges.push({ label: 'Keyword: Curse', color: 'bg-purple-950 text-purple-300 border-purple-700' });
      if (/Aptitude/i.test(t)) badges.push({ label: 'Keyword: Aptitude', color: 'bg-sky-950 text-sky-300 border-sky-700' });
      if (/Allegiance/i.test(t)) badges.push({ label: 'Keyword: Allegiance', color: 'bg-blue-950 text-blue-300 border-blue-700' });
      if (/Overcharge/i.test(t)) badges.push({ label: 'Keyword: Overcharge', color: 'bg-amber-950 text-amber-300 border-amber-700' });
      if (/chance for critical/i.test(t)) badges.push({ label: 'Keyword: Critical', color: 'bg-rose-950 text-rose-300 border-rose-700' });
      if (/chance for evasion/i.test(t)) badges.push({ label: 'Keyword: Evasion', color: 'bg-teal-950 text-teal-300 border-teal-700' });
      if (/wins chance roll/i.test(t)) badges.push({ label: 'Action: Force Chance Win', color: 'bg-yellow-950 text-yellow-300 border-yellow-700' });

      // Target
      if (/target\s+enemy\s+ally/i.test(t)) badges.push({ label: 'Target: Enemy Ally', color: 'bg-red-950 text-red-300 border-red-700' });
      else if (/target\s+ally\s+you\s+control/i.test(t)) badges.push({ label: 'Target: Friendly Ally', color: 'bg-blue-950 text-blue-300 border-blue-700' });
      else if (/target\s+ally\s+or\s+skill/i.test(t)) badges.push({ label: 'Target: Ally or Skill', color: 'bg-purple-950 text-purple-300 border-purple-700' });
      else if (/target\s+character/i.test(t)) badges.push({ label: 'Target: Any Character', color: 'bg-slate-800 text-slate-300 border-slate-600' });
      else if (/you\s+gain|your\s+hero/i.test(t)) badges.push({ label: 'Target: Self Hero', color: 'bg-amber-950 text-amber-300 border-amber-700' });

      return {
        recognized: badges.length > 0,
        badges
      };
    }

    function parseAbilityTextToBuilderState(rawText, cardName, cardType) {
      if (!rawText || !rawText.trim()) return { ...DEFAULT_BUILDER_STATE };
      const text = rawText.trim();
      const res = { ...DEFAULT_BUILDER_STATE };
      const cName = (cardName || "").trim();

      // Check if it's an exact preset match first for 100% fidelity
      const matchedPreset = OFFICIAL_ABILITY_PRESETS.find(p => p.recommended && p.recommended.trim().toLowerCase() === text.toLowerCase());
      if (matchedPreset) {
        return { ...DEFAULT_BUILDER_STATE, ...matchedPreset };
      }

      // 1. Keyword check
      for (const kw of Object.keys(KEYWORD_DEFINITIONS)) {
        if (new RegExp(`^${kw}\\b`, 'i').test(text) || new RegExp(`\\(${kw}\\)`, 'i').test(text)) {
          if (text.length < 50 || !text.includes(':') || new RegExp(`^${kw}:`, 'i').test(text)) {
            res.category = 'keyword';
            res.selectedKeyword = kw;
            return res;
          }
        }
      }

      // 2. Proficiency check
      const profM = text.match(/Proficiency\s+(\d+)\s*:/i);
      if (profM) {
        res.category = 'proficiency';
        res.profLevel = parseInt(profM[1]);
      }

      // 3. Activated costs & timings
      const manaM = text.match(/\[Mana:\s*(\d+)(?:-(\d+))?\]/i) || text.match(/Pay\s+(\d+)\s+mana/i);
      const goldM = text.match(/\[Gold:\s*(\d+)\]/i) || text.match(/Pay\s+(\d+)\s+gold/i);
      const exhM = text.match(/Exhaust\s+([^:]+):/i);

      if (manaM || goldM || exhM || /^Once per turn/i.test(text)) {
        if (!profM) res.category = 'activated';
        if (manaM) {
          res.actManaCost = parseInt(manaM[1]);
          if (manaM[2]) {
            res.actIsVariableMana = true;
            res.actVariableMax = parseInt(manaM[2]);
          }
        }
        if (goldM) res.actGoldCost = parseInt(goldM[1]);
        if (exhM) res.actExhaustTarget = /hero/i.test(exhM[1]) ? 'hero' : 'thisCard';

        if (manaM && exhM) res.actCostType = 'mana_exhaust';
        else if (goldM && exhM) res.actCostType = 'gold_exhaust';
        else if (exhM) res.actCostType = 'exhaust';
        else if (goldM) res.actCostType = 'gold';
        else if (manaM) res.actCostType = 'mana';
        else res.actCostType = 'free';

        if (/Once per turn/i.test(text)) res.actFrequency = 'once';
        else if (/Up to twice per turn/i.test(text)) res.actFrequency = 'twice';
        else res.actFrequency = 'unlimited';

        if (/command phase/i.test(text)) res.actPhase = 'command';
        else if (/combat phase/i.test(text)) res.actPhase = 'combat';
        else res.actPhase = 'any';
      }

      // 4. Triggered events
      if (/When .* (?:comes into play|is played)/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onPlay';
        if (/an ally you control/i.test(text)) res.trigSubject = 'friendlyAlly';
        else if (/an ally/i.test(text)) res.trigSubject = 'anyAlly';
        else res.trigSubject = 'self';

        if (/battle zone/i.test(text)) res.trigZone = 'battleZone';
        else if (/bench/i.test(text)) res.trigZone = 'bench';
        else if (/skill slot/i.test(text)) res.trigZone = 'skillSlot';
        else res.trigZone = 'any';
      } else if (/When .* is defeated/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onDefeat';
        if (/an ally you control/i.test(text)) res.trigSubject = 'friendlyAlly';
        else if (/an enemy hero/i.test(text)) res.trigSubject = 'enemyHero';
        else if (/an enemy ally/i.test(text)) res.trigSubject = 'enemyAlly';
        else if (/any ally/i.test(text)) res.trigSubject = 'anyAlly';
        else res.trigSubject = 'self';

        if (/battle zone/i.test(text)) res.trigZone = 'battleZone';
        else if (/bench/i.test(text)) res.trigZone = 'bench';
        else res.trigZone = 'any';
      } else if (/Strike\s+(\d+)\s*:/i.test(text) || /attacks on strike\s+(\d+)/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onStrike';
        const sM = text.match(/strike\s+(\d+)/i);
        if (sM) res.trigStrikeNum = parseInt(sM[1]);
        if (/from your bench/i.test(text)) res.trigStrikeZone = 'bench';
        else res.trigStrikeZone = 'any';
      } else if (/When rolling accuracy/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onAccuracyRoll';
        if (/your hero/i.test(text)) res.trigSubject = 'hero';
        else if (/an ally you control/i.test(text)) res.trigSubject = 'friendlyAlly';
        else res.trigSubject = 'self';
      } else if (/Whenever .* deals? combat damage/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onDamageDealt';
        if (/an ally you control/i.test(text)) res.trigDamageSource = 'friendlyAlly';
        else if (/\byou\s+deal/i.test(text)) res.trigDamageSource = 'hero';
        else res.trigDamageSource = 'self';

        if (/a hero/i.test(text) || /enemy hero/i.test(text)) res.trigDamageVictim = 'enemyHero';
        else if (/enemy ally/i.test(text)) res.trigDamageVictim = 'enemyAlly';
        else res.trigDamageVictim = 'anyEnemy';

        if (/dagger equipped/i.test(text)) res.trigDamageWeapon = 'dagger';
        else if (/with/i.test(text) && cName && text.includes(cName)) res.trigDamageWeapon = 'withSkill';
        else res.trigDamageWeapon = 'none';
      } else if (/Whenever .* takes? combat damage/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onDamageTaken';
        if (/your hero/i.test(text)) res.trigSubject = 'hero';
        else if (/an ally you control/i.test(text)) res.trigSubject = 'friendlyAlly';
        else res.trigSubject = 'self';
      } else if (/Whenever .* gains? health/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onHeal';
        if (/an ally you control/i.test(text)) res.trigHealSubject = 'friendlyAlly';
        else if (/a character/i.test(text)) res.trigHealSubject = 'character';
        else res.trigHealSubject = 'hero';
      } else if (/Whenever .* draws?/i.test(text) || /At the start of your turn after drawing/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onDraw';
        if (/start of your turn after drawing/i.test(text)) res.trigDrawSource = 'turnStart';
        else if (/from an ability/i.test(text)) res.trigDrawSource = 'fromAbility';
        else res.trigDrawSource = 'any';
      } else if (/Whenever .* (?:wins a chance roll|rolls for chance)/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onChanceWin';
        if (/rolls for chance/i.test(text)) res.trigChanceEvent = 'roll';
        else res.trigChanceEvent = 'win';
      } else if (/Whenever .* counterstrikes/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onCounterstrike';
        if (/you counterstrike/i.test(text)) res.trigCounterstrikeWho = 'you';
        else if (/counterstrikes/i.test(text) && cName && text.includes(cName)) res.trigCounterstrikeWho = 'defending';
        else res.trigCounterstrikeWho = 'character';
      } else if (/At the (?:start|end) of your/i.test(text)) {
        res.category = 'triggered';
        res.trigEvent = 'onTurnStart';
        if (/end of your turn/i.test(text)) res.trigTurnPhase = 'turnEnd';
        else if (/command phase/i.test(text)) res.trigTurnPhase = 'command';
        else if (/combat phase/i.test(text)) res.trigTurnPhase = 'combat';
        else res.trigTurnPhase = 'turnStart';
      }

      // 5. Static / Continuous
      if (/is your Vanguard/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'zone_role';
        res.staticZoneRole = 'vanguard';
        const clMatch = text.match(/All (\w+)s you control/i);
        if (clMatch) res.staticClass = clMatch[1].charAt(0).toUpperCase() + clMatch[1].slice(1).toLowerCase();
      } else if (/can strike from your bench/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'zone_role';
        res.staticZoneRole = 'bench_strike';
      } else if (/while on your bench/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'zone_role';
        res.staticZoneRole = 'bench';
      } else if (/control another (\w+)/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'control_synergy';
        res.staticSynergyType = 'another_class';
        const clM = text.match(/control another (\w+)/i);
        if (clM) res.staticClass = clM[1].charAt(0).toUpperCase() + clM[1].slice(1).toLowerCase();
      } else if (/All (\w+)s you control have/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'control_synergy';
        res.staticSynergyType = 'all_class';
        const clM = text.match(/All (\w+)s you control/i);
        if (clM) res.staticClass = clM[1].charAt(0).toUpperCase() + clM[1].slice(1).toLowerCase();
      } else if (/Other (\w+)s you control get/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'control_synergy';
        res.staticSynergyType = 'other_race';
        const rM = text.match(/Other (\w+)s you control/i);
        if (rM) res.staticRace = rM[1].charAt(0).toUpperCase() + rM[1].slice(1).toLowerCase();
      } else if (/for every charge/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'scaling';
        res.staticScaling = 'per_charge';
      } else if (/discard pile/i.test(text)) {
        res.category = 'static';
        res.staticConditionMode = 'scaling';
        res.staticScaling = 'discard_count';
      }

      // 6. Modality & Conditions
      res.isOptional = /\byou may\b/i.test(text);
      res.isChanceRoll = /roll for chance/i.test(text);
      if (/If successful/i.test(text)) res.chanceStyle = 'if_successful';
      else if (/If you win/i.test(text)) res.chanceStyle = 'if_win';
      else if (/roll for chance to/i.test(text)) res.chanceStyle = 'infinitive';

      if (/If you do\b/i.test(text)) {
        res.effectCondition = 'if_you_do';
        if (/mana that was spent/i.test(text)) res.referringAction = 'mana_spent';
        else if (/gold that was spent/i.test(text)) res.referringAction = 'gold_spent';
        else if (/charge spent/i.test(text)) res.referringAction = 'charge_spent';
        else if (/soldier you control/i.test(text)) res.referringAction = 'soldiers_controlled';
        else if (/ally you control/i.test(text)) res.referringAction = 'allies_controlled';
        else if (/counter on it/i.test(text)) res.referringAction = 'counters_on_it';
        else if (/combat damage dealt/i.test(text)) res.referringAction = 'damage_dealt';
        else if (/attack roll/i.test(text)) res.referringAction = 'attack_roll';
        else if (/sacrifice your third strike/i.test(text)) res.referringAction = 'sacrifice_strike';
        else if (/lose the health gained/i.test(text)) res.referringAction = 'hp_lost';

        if (/1 trigger/i.test(text)) res.conditionNote = 'single_trigger';
        else if (/original roll is null/i.test(text)) res.conditionNote = 'null_original';
        else if (/re-roll once/i.test(text)) res.conditionNote = 'reroll_once';
      } else if (/If successful/i.test(text)) {
        res.effectCondition = 'if_chance_success';
      } else if (/If you win/i.test(text)) {
        res.effectCondition = 'if_chance_win';
      } else if (/If you defeated an enemy ally/i.test(text)) {
        res.effectCondition = 'if_defeated_enemy';
      } else if (/If an enemy took non-combat damage/i.test(text)) {
        res.effectCondition = 'if_enemy_noncombat';
      } else if (/If you have struck twice/i.test(text)) {
        res.effectCondition = 'if_struck_twice';
        if (/sacrifice your third strike/i.test(text)) res.referringAction = 'sacrifice_strike';
      } else if (/If you roll a 1/i.test(text)) {
        res.effectCondition = 'if_roll_one';
      } else if (/If .* has (\d+) charge/i.test(text)) {
        res.effectCondition = 'if_charge_count';
        const cM = text.match(/has (\d+) charge/i);
        if (cM) res.condChargeThreshold = parseInt(cM[1]);
      } else if (/If target is a (\w+)/i.test(text)) {
        res.effectCondition = 'if_target_class';
        const tcM = text.match(/If target is a (\w+)/i);
        if (tcM) res.condClass = tcM[1].charAt(0).toUpperCase() + tcM[1].slice(1).toLowerCase();
      } else if (/If user has (a \w+) equipped/i.test(text)) {
        res.effectCondition = 'if_user_equipped';
        const eqM = text.match(/If user has (a \w+) equipped/i);
        if (eqM) res.condEquipType = eqM[1].toLowerCase();
      }

      // 7. Strike Consequences
      if (/Striking with.*ends your combat phase/i.test(text)) {
        res.strikeConsequence = 'ends_combat_phase';
      } else if (/Striking with.*exhausts your hero/i.test(text)) {
        res.strikeConsequence = 'exhausts_hero';
      } else if (/Striking with.*sacrifices your remaining strikes/i.test(text)) {
        res.strikeConsequence = 'sacrifice_strikes';
      }

      // 8. Effect Type & Action
      if (/keep rolling until you fail/i.test(text)) {
        res.effectType = 'repeat_roll';
        res.repeatRollType = 'accuracy';
        const mHits = text.match(/succeed\s+(\d+)\s+times/i);
        if (mHits) res.repeatMaxCount = parseInt(mHits[1]);
        if (/until you fail or/i.test(text)) res.repeatStopCondition = 'until_fail_or_max';
        else if (/until you succeed/i.test(text)) res.repeatStopCondition = 'until_success';
        else res.repeatStopCondition = 'until_fail';

        if (/deals\s+it'?s\s+ranged\s+attack\s+damage/i.test(text)) res.repeatSuccessOutcome = 'deals_ranged_damage';
        else if (/deals\s+it'?s\s+combat\s+damage/i.test(text)) res.repeatSuccessOutcome = 'deals_combat_damage';
        else if (/deals\s+(\d+)\s+non-combat\s+damage/i.test(text)) {
          res.repeatSuccessOutcome = 'deals_noncombat_damage';
          const dM = text.match(/deals\s+(\d+)\s+non-combat\s+damage/i);
          if (dM) res.effectAmount = parseInt(dM[1]);
        } else if (/charge/i.test(text)) res.repeatSuccessOutcome = 'gain_charge';
        else res.repeatSuccessOutcome = 'none';
      } else if (/gains?\s+(\d+)\s+health/i.test(text) || /\bheal\b/i.test(text)) {
        res.effectType = 'heal';
        const hM = text.match(/(\d+)\s+health/i);
        if (hM) res.effectAmount = parseInt(hM[1]);

        if (/you gain/i.test(text)) res.effectTarget = 'selfHero';
        else if (/target ally you control/i.test(text)) res.effectTarget = 'targetFriendlyAlly';
        else if (/target enemy ally/i.test(text)) res.effectTarget = 'targetEnemyAlly';
        else if (/target ally/i.test(text)) res.effectTarget = 'targetAlly';
        else if (/target character/i.test(text)) res.effectTarget = 'targetCharacter';
        else res.effectTarget = 'self';
      } else if (/\bdraw\s+(?:a|(\d+))\s+cards?/i.test(text)) {
        res.effectType = 'draw';
        const dM = text.match(/draw\s+(\d+)\s+cards?/i);
        res.effectAmount = dM ? parseInt(dM[1]) : 1;
      } else if (/\bgains?\s+(\d+)\s+mana/i.test(text)) {
        res.effectType = 'mana';
        const mM = text.match(/(\d+)\s+mana/i);
        if (mM) res.effectAmount = parseInt(mM[1]);
      } else if (/gains?\s+(\d+)\s+charge/i.test(text) || /deplete\s+(\d+)\s+charge/i.test(text)) {
        res.effectType = 'charge';
        const cM = text.match(/(\d+)\s+charge/i);
        if (cM) res.effectAmount = parseInt(cM[1]);

        if (/deplete/i.test(text)) res.effectTarget = 'deplete';
        else if (/target ally or skill/i.test(text)) res.effectTarget = 'targetAllyOrSkill';
        else if (/target ranged skill/i.test(text)) res.effectTarget = 'targetRangedSkill';
        else if (/target skill/i.test(text)) res.effectTarget = 'targetSkill';
        else if (/target ally you control/i.test(text)) res.effectTarget = 'targetFriendlyAlly';
        else if (/target ally/i.test(text)) res.effectTarget = 'targetAlly';
        else res.effectTarget = 'self';
      } else if (/\bdeals?\s+(\d+)\s+(?:non-combat\s+)?damage/i.test(text)) {
        res.effectType = 'damage';
        const dM = text.match(/deals?\s+(\d+)\s+(?:non-combat\s+)?damage/i);
        if (dM) res.effectAmount = parseInt(dM[1]);

        if (/all allies in play/i.test(text)) res.effectTarget = 'allAllies';
        else if (/target enemy ally/i.test(text)) res.effectTarget = 'targetEnemyAlly';
        else if (/target character/i.test(text)) res.effectTarget = 'targetCharacter';
        else res.effectTarget = 'targetAlly';
      } else if (/loses?\s+(\d+)\s+health/i.test(text)) {
        res.effectType = 'lose_health';
        const lM = text.match(/(\d+)\s+health/i);
        if (lM) res.effectAmount = parseInt(lM[1]);
        if (/target enemy ally/i.test(text)) res.effectTarget = 'targetEnemyAlly';
        else if (/target ally you control/i.test(text)) res.effectTarget = 'targetFriendlyAlly';
        else res.effectTarget = 'targetCharacter';
      } else if (/\+(\d+)\s+(power|defense|dexterity|ranged attack|max health|to accuracy rolls)/i.test(text)) {
        res.effectType = 'stat_buff';
        const bM = text.match(/\+(\d+)\s+(power|defense|dexterity|ranged attack|max health|to accuracy rolls)/i);
        if (bM) {
          res.effectAmount = parseInt(bM[1]);
          const sName = bM[2].toLowerCase();
          if (sName === 'power') res.effectStat = 'power';
          else if (sName === 'defense') res.effectStat = 'defense';
          else if (sName === 'dexterity') res.effectStat = 'dexterity';
          else if (sName === 'ranged attack') res.effectStat = 'rangedAttack';
          else if (sName === 'max health') res.effectStat = 'maxHealth';
          else if (sName === 'to accuracy rolls') res.effectStat = 'accuracy';
        }
        if (/this strike/i.test(text)) res.effectDuration = 'thisStrike';
        else if (/this turn/i.test(text)) res.effectDuration = 'thisTurn';
        else res.effectDuration = 'permanent';

        if (/You get|yourself/i.test(text)) res.effectTarget = 'selfHero';
        else if (/Defending allies you control/i.test(text)) res.effectTarget = 'allFriendlyDefending';
        else if (/Target ally you control/i.test(text)) res.effectTarget = 'targetFriendlyAlly';
        else if (/Target ally/i.test(text)) res.effectTarget = 'targetAlly';
        else if (/Target character/i.test(text)) res.effectTarget = 'targetCharacter';
        else res.effectTarget = 'self';
      } else if (/(\d+)\s+([^.\n]+)\s+Tokens?/i.test(text)) {
        res.effectType = 'token';
        const tM = text.match(/(\d+)\s+([^.\n]+)\s+Tokens?/i);
        if (tM) {
          res.tokenAmount = parseInt(tM[1]);
          res.tokenName = tM[2].trim();
        }
      } else if (/look at the top/i.test(text) || /search your loot/i.test(text)) {
        res.effectType = 'look_loot';
        const cM = text.match(/top\s+(\d+)\s+cards/i);
        res.lootCardsCount = cM ? parseInt(cM[1]) : 1;
        if (/reveal a skill/i.test(text)) res.lootAction = 'reveal_skill';
        else if (/skill 1 level higher/i.test(text)) res.lootAction = 'search_level';
        else res.lootAction = 'hand';
      } else if (/attack is (D4|D6|D8|D10|D12)/i.test(text)) {
        res.effectType = 'attack_die';
        const aM = text.match(/attack is (D4|D6|D8|D10|D12)/i);
        if (aM) res.attackDieValue = aM[1].toUpperCase();
      } else if (/roll again and your original roll is null/i.test(text)) {
        res.effectType = 're_roll';
      } else if (/wins chance roll/i.test(text)) {
        res.effectType = 'force_chance';
      } else {
        // Check keyword grant
        let foundKw = false;
        for (const kw of Object.keys(KEYWORD_DEFINITIONS)) {
          if (new RegExp(`\\b${kw}\\b`, 'i').test(text)) {
            res.effectType = 'keyword_grant';
            res.effectKeyword = kw;
            foundKw = true;
            break;
          }
        }
        if (!foundKw) {
          res.effectType = 'custom';
          res.customEffectText = text;
        }
      }

      return res;
    }

    function AbilityBuilderModal({ isOpen, onClose, onApply, cardName, cardType, initialAbilities, initialClause }) {
      if (!isOpen) return null;

      // Classification
      const [category, setCategory] = useState(cardType === 'Skill' ? 'proficiency' : 'activated');
      
      // Activated Costs & Timing
      const [actCostType, setActCostType] = useState('mana');
      const [actManaCost, setActManaCost] = useState(2);
      const [actIsVariableMana, setActIsVariableMana] = useState(false);
      const [actVariableMax, setActVariableMax] = useState(3);
      const [actGoldCost, setActGoldCost] = useState(2);
      const [actExhaustTarget, setActExhaustTarget] = useState('thisCard');
      const [actPhase, setActPhase] = useState('any');
      const [actFrequency, setActFrequency] = useState('once');

      // Triggered Hierarchy
      const [trigEvent, setTrigEvent] = useState('onPlay');
      const [trigSubject, setTrigSubject] = useState('self');
      const [trigZone, setTrigZone] = useState('any');
      const [trigStrikeNum, setTrigStrikeNum] = useState(2);
      const [trigStrikeZone, setTrigStrikeZone] = useState('any');
      const [trigDamageSource, setTrigDamageSource] = useState('self');
      const [trigDamageVictim, setTrigDamageVictim] = useState('anyEnemy');
      const [trigDamageWeapon, setTrigDamageWeapon] = useState('none');
      const [trigHealSubject, setTrigHealSubject] = useState('hero');
      const [trigDrawSource, setTrigDrawSource] = useState('fromAbility');
      const [trigChanceEvent, setTrigChanceEvent] = useState('win');
      const [trigCounterstrikeWho, setTrigCounterstrikeWho] = useState('character');
      const [trigTurnPhase, setTrigTurnPhase] = useState('turnStart');

      // Static Aura Hierarchy
      const [staticConditionMode, setStaticConditionMode] = useState('always');
      const [staticZoneRole, setStaticZoneRole] = useState('vanguard');
      const [staticSynergyType, setStaticSynergyType] = useState('another_class');
      const [staticClass, setStaticClass] = useState('Soldier');
      const [staticRace, setStaticRace] = useState('Elf');
      const [staticPrecondition, setStaticPrecondition] = useState('enemy_defeated');
      const [staticScaling, setStaticScaling] = useState('per_charge');

      // Keyword & Proficiency
      const [selectedKeyword, setSelectedKeyword] = useState('Freeze');
      const [profLevel, setProfLevel] = useState(2);

      // Modality & Chance Roll
      const [isOptional, setIsOptional] = useState(false);
      const [isChanceRoll, setIsChanceRoll] = useState(false);
      const [chanceStyle, setChanceStyle] = useState('if_successful');

      // If Condition & Referral Mapping
      const [effectCondition, setEffectCondition] = useState('none');
      const [referringAction, setReferringAction] = useState('mana_spent');
      const [conditionNote, setConditionNote] = useState('none');
      const [condChargeThreshold, setCondChargeThreshold] = useState(5);
      const [condClass, setCondClass] = useState('Mage');
      const [condEquipType, setCondEquipType] = useState('a dagger');
      const [customConditionText, setCustomConditionText] = useState('');

      // Then Effect Action & Targeting
      const [effectType, setEffectType] = useState('heal');
      const [effectTarget, setEffectTarget] = useState('targetCharacter');
      const [effectAmount, setEffectAmount] = useState(2);
      const [effectStat, setEffectStat] = useState('power');
      const [effectDuration, setEffectDuration] = useState('thisTurn');
      const [effectKeyword, setEffectKeyword] = useState('Freeze');
      const [tokenName, setTokenName] = useState('Korvas Soldier');
      const [tokenAmount, setTokenAmount] = useState(1);
      const [lootCardsCount, setLootCardsCount] = useState(1);
      const [lootAction, setLootAction] = useState('hand');
      const [attackDieValue, setAttackDieValue] = useState('D8');
      const [customEffectText, setCustomEffectText] = useState('');

      // Repeat Roll / Cascade Parameters
      const [repeatRollType, setRepeatRollType] = useState('accuracy');
      const [repeatStopCondition, setRepeatStopCondition] = useState('until_fail_or_max');
      const [repeatMaxCount, setRepeatMaxCount] = useState(5);
      const [repeatSuccessOutcome, setRepeatSuccessOutcome] = useState('deals_ranged_damage');
      const [strikeConsequence, setStrikeConsequence] = useState('none');

      // Manual Override / Preview Text
      const [manualText, setManualText] = useState('');
      const [isManualEdit, setIsManualEdit] = useState(false);

      // Multi-ability clauses stacked for this card
      const [stackedClauses, setStackedClauses] = useState(() => {
        if (!initialAbilities) return [];
        return initialAbilities.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      });

      // Synchronized State Bundle
      const currentState = {
        category,
        actCostType, actManaCost, actIsVariableMana, actVariableMax, actGoldCost, actExhaustTarget, actPhase, actFrequency,
        trigEvent, trigSubject, trigZone, trigStrikeNum, trigStrikeZone,
        trigDamageSource, trigDamageVictim, trigDamageWeapon,
        trigHealSubject, trigDrawSource, trigChanceEvent, trigCounterstrikeWho, trigTurnPhase,
        staticConditionMode, staticZoneRole, staticSynergyType, staticClass, staticRace, staticPrecondition, staticScaling,
        selectedKeyword, profLevel,
        isOptional, isChanceRoll, chanceStyle,
        effectCondition, referringAction, conditionNote, condChargeThreshold, condClass, condEquipType, customConditionText,
        effectType, effectTarget, effectAmount, effectStat, effectDuration, effectKeyword,
        tokenName, tokenAmount, lootCardsCount, lootAction, attackDieValue, customEffectText,
        repeatRollType, repeatStopCondition, repeatMaxCount, repeatSuccessOutcome, strikeConsequence
      };

      const recommendedText = useMemo(() => {
        return generateAbilityTextFromState(currentState, cardName);
      }, [currentState, cardName]);

      const activeText = isManualEdit ? manualText : recommendedText;
      const engineAnalysis = useMemo(() => analyzeAbilityForEngine(activeText), [activeText]);

      // Robust Reset & Preset Application: Never leaves stale flags that could hide Step 3!
      const handlePresetSelect = (preset) => {
        const next = { ...DEFAULT_BUILDER_STATE, ...preset };
        setCategory(next.category);
        setActCostType(next.actCostType);
        setActManaCost(next.actManaCost);
        setActIsVariableMana(Boolean(next.actIsVariableMana));
        setActVariableMax(next.actVariableMax);
        setActGoldCost(next.actGoldCost);
        setActExhaustTarget(next.actExhaustTarget);
        setActPhase(next.actPhase);
        setActFrequency(next.actFrequency);

        setTrigEvent(next.trigEvent);
        setTrigSubject(next.trigSubject);
        setTrigZone(next.trigZone);
        setTrigStrikeNum(next.trigStrikeNum);
        setTrigStrikeZone(next.trigStrikeZone);
        setTrigDamageSource(next.trigDamageSource);
        setTrigDamageVictim(next.trigDamageVictim);
        setTrigDamageWeapon(next.trigDamageWeapon);
        setTrigHealSubject(next.trigHealSubject);
        setTrigDrawSource(next.trigDrawSource);
        setTrigChanceEvent(next.trigChanceEvent);
        setTrigCounterstrikeWho(next.trigCounterstrikeWho);
        setTrigTurnPhase(next.trigTurnPhase);

        setStaticConditionMode(next.staticConditionMode);
        setStaticZoneRole(next.staticZoneRole);
        setStaticSynergyType(next.staticSynergyType);
        setStaticClass(next.staticClass);
        setStaticRace(next.staticRace);
        setStaticPrecondition(next.staticPrecondition);
        setStaticScaling(next.staticScaling);

        setSelectedKeyword(next.selectedKeyword);
        setProfLevel(next.profLevel);

        setIsOptional(Boolean(next.isOptional));
        setIsChanceRoll(Boolean(next.isChanceRoll));
        setChanceStyle(next.chanceStyle || 'if_successful');

        setEffectCondition(next.effectCondition);
        setReferringAction(next.referringAction);
        setConditionNote(next.conditionNote);
        setCondChargeThreshold(next.condChargeThreshold);
        setCondClass(next.condClass);
        setCondEquipType(next.condEquipType);
        setCustomConditionText(next.customConditionText || '');

        setEffectType(next.effectType);
        setEffectTarget(next.effectTarget);
        setEffectAmount(next.effectAmount);
        setEffectStat(next.effectStat);
        setEffectDuration(next.effectDuration);
        setEffectKeyword(next.effectKeyword);
        setTokenName(next.tokenName);
        setTokenAmount(next.tokenAmount);
        setLootCardsCount(next.lootCardsCount);
        setLootAction(next.lootAction);
        setAttackDieValue(next.attackDieValue);
        setCustomEffectText(next.customEffectText || '');
        setRepeatRollType(next.repeatRollType || 'accuracy');
        setRepeatStopCondition(next.repeatStopCondition || 'until_fail_or_max');
        setRepeatMaxCount(next.repeatMaxCount || 5);
        setRepeatSuccessOutcome(next.repeatSuccessOutcome || 'none');
        setStrikeConsequence(next.strikeConsequence || 'none');

        setIsManualEdit(false);
      };

      const [activeClauseIdx, setActiveClauseIdx] = useState(null);

      const handleLoadClause = (clauseText, idx = null) => {
        if (!clauseText || !clauseText.trim()) return;
        const parsed = parseAbilityTextToBuilderState(clauseText, cardName, cardType);
        handlePresetSelect(parsed);
        setActiveClauseIdx(idx);
      };

      const handleUpdateActiveClause = () => {
        if (activeClauseIdx === null || !activeText.trim()) return;
        setStackedClauses(prev => {
          const next = [...prev];
          next[activeClauseIdx] = activeText.trim();
          return next;
        });
      };

      useEffect(() => {
        if (isOpen) {
          if (initialClause) {
            handleLoadClause(initialClause, null);
          } else if (initialAbilities) {
            const clauses = initialAbilities.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
            if (clauses.length > 0) {
              handleLoadClause(clauses[0], 0);
            }
          }
        }
      }, [isOpen, initialClause]);

      const handleAddClauseToStack = () => {
        if (!activeText.trim()) return;
        setStackedClauses(prev => {
          const next = [...prev, activeText.trim()];
          setActiveClauseIdx(next.length - 1);
          return next;
        });
        setIsManualEdit(false);
      };

      const handleRemoveClause = (idx) => {
        setStackedClauses(prev => prev.filter((_, i) => i !== idx));
        if (activeClauseIdx === idx) setActiveClauseIdx(null);
        else if (activeClauseIdx > idx) setActiveClauseIdx(prev => prev - 1);
      };

      const handleFinishApply = (mode) => {
        let finalOutput = "";
        if (mode === 'replace_all') {
          finalOutput = stackedClauses.length > 0 ? stackedClauses.join("\n\n") : activeText.trim();
        } else if (mode === 'append_single') {
          const current = (initialAbilities || "").trim();
          finalOutput = current ? `${current}\n\n${activeText.trim()}` : activeText.trim();
        } else if (mode === 'replace_with_active') {
          finalOutput = activeText.trim();
        }
        onApply(finalOutput);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 z-[95] overflow-y-auto">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[94vh] flex flex-col shadow-2xl overflow-hidden min-w-0 animate-fade-in">
            
            {/* Modal Header */}
            <div className="px-4 py-3 sm:px-6 sm:py-4 border-b border-slate-800 bg-slate-950/80 flex justify-between items-center shrink-0">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-slate-950 font-black text-base shadow-md">✨</span>
                <div className="min-w-0">
                  <h3 className="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2 truncate">
                    <span>Guided Ability Builder</span>
                    <span className="text-[10px] bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-amber-400 font-semibold uppercase">
                      {cardType || 'Card'}
                    </span>
                  </h3>
                  <p className="text-[11px] text-slate-400 truncate">
                    Configuring for: <strong className="text-slate-200">{cardName || 'Unnamed Card'}</strong>
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-xl p-1 leading-none rounded hover:bg-slate-800 transition">✕</button>
            </div>

            {/* Modal Scrollable Body */}
            <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5 text-xs sm:text-sm">
              
              {/* Presets Bar */}
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5">
                <div className="flex items-center gap-1.5 text-xs font-bold text-slate-300">
                  <span>💡</span><span>Quick Official Templates:</span>
                </div>
                <select 
                  onChange={e => {
                    const found = OFFICIAL_ABILITY_PRESETS.find(p => p.name === e.target.value);
                    if (found) handlePresetSelect(found);
                  }}
                  className="w-full sm:w-auto bg-slate-900 border border-slate-700 text-xs text-amber-400 font-medium rounded-lg px-2.5 py-1.5 focus:border-amber-500 outline-none">
                  <option value="">-- Choose an Official Card Template --</option>
                  {OFFICIAL_ABILITY_PRESETS.map(p => (
                    <option key={p.name} value={p.name}>{p.name}</option>
                  ))}
                </select>
              </div>

              {/* Step 1: Category Selector */}
              <div>
                <label className="text-[11px] uppercase font-bold text-slate-400 tracking-wider block mb-2">
                  1. Ability Classification
                </label>
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                  {[
                    { id: 'activated', label: '⚡ Activated', desc: 'Pay Mana / Gold / Tap' },
                    { id: 'triggered', label: '🎯 Triggered', desc: 'On Play / On Defeat / Strike' },
                    { id: 'static', label: '🛡️ Static / Aura', desc: 'Constant Buff / Vanguard' },
                    { id: 'keyword', label: '⚔️ Keyword', desc: 'Freeze, Advantage, etc.' },
                    { id: 'proficiency', label: '🔮 Proficiency', desc: 'Level 2 / 3 Upgrade' }
                  ].map(cat => (
                    <button
                      key={cat.id}
                      type="button"
                      onClick={() => { setCategory(cat.id); setIsManualEdit(false); }}
                      className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${category === cat.id ? 'bg-amber-600/20 border-amber-500 text-white shadow-md' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'}`}>
                      <span className="font-bold text-xs truncate">{cat.label}</span>
                      <span className="text-[10px] text-slate-500 mt-1 truncate">{cat.desc}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Step 2: Reactive Timing, Costs & Conditions */}
              <div className="bg-slate-950/40 p-4 rounded-xl border border-slate-800 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                    2. {category === 'activated' ? 'Activation Cost & Timing' : (category === 'triggered' ? 'Trigger Event, Subject & Location' : (category === 'static' ? 'Static Condition, Role & Synergy' : (category === 'keyword' ? 'Select Official Keyword' : 'Proficiency Tier')))}
                  </span>
                  <span className="text-[10px] text-slate-500 font-medium">Reactive inputs based on classification</span>
                </div>

                {/* 2A. Activated Form */}
                {category === 'activated' && (
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Cost Method</label>
                      <select 
                        value={actCostType} 
                        onChange={e => { setActCostType(e.target.value); setIsManualEdit(false); }} 
                        className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:border-amber-500">
                        <option value="mana">Mana Cost ([Mana:X])</option>
                        <option value="gold">Gold Cost ([Gold:X])</option>
                        <option value="exhaust">Exhaust Unit (No Mana)</option>
                        <option value="mana_exhaust">Mana + Exhaust ([Mana:X] Exhaust:)</option>
                        <option value="gold_exhaust">Gold + Exhaust ([Gold:X] Exhaust:)</option>
                        <option value="free">Free / Timing Only</option>
                      </select>
                    </div>

                    {(actCostType === 'mana' || actCostType === 'mana_exhaust') && (
                      <div>
